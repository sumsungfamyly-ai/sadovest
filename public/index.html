<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Садовест</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ================= СадоВест · «Изумрудное сияние» ================= */
:root{
  --bg:#ecfdf5;--card:rgba(255,255,255,.82);--cs:#fff;--ink:#0b2a1f;--mute:#47685a;--line:rgba(10,143,102,.2);
  --g1:#0a8f66;--g2:#066f4d;--g3:#0c9a8e;--mint:#34d399;--lime:#a3e635;--gold:#f6c744;--goldbg:#fff3c4;--red:#c0392b;
  /* переливы: яркий — для фонов и рамок, тёмный — под белый текст, «текстовый» — для заголовков */
  --irid:linear-gradient(115deg,#0a8f66,#14b8a6 20%,#5fd38a 42%,#a3e635 56%,#2dd4bf 76%,#0a8f66);
  --irid-d:linear-gradient(115deg,#066f4d,#0a8f66 18%,#0c9a8e 38%,#1a9a55 58%,#3f9b2a 74%,#0c9a8e 90%,#066f4d);
  --irid-t:linear-gradient(100deg,#065f46,#0a8f66 25%,#0c9a8e 50%,#2e8b3d 75%,#065f46);
  --sh:0 1px 2px rgba(6,80,56,.06),0 14px 30px -10px rgba(6,110,76,.2);--glow:rgba(20,184,166,.5);
  --page:linear-gradient(180deg,#b7efd3 0%,#d6f8e6 38%,#eefcf5 100%);--navbg:rgba(255,255,255,.9);--soft:rgba(52,211,153,.16);--soft2:rgba(45,212,191,.12);
}
html[data-theme=dark]{
  --bg:#04120c;--card:rgba(13,42,30,.76);--cs:#0d2a1e;--ink:#e6fff3;--mute:#9cc9b3;--line:rgba(94,234,168,.24);
  --g1:#34d399;--g2:#6ee7b7;--g3:#2dd4bf;--goldbg:#3a3418;
  --irid-t:linear-gradient(100deg,#6ee7b7,#34d399 25%,#5eead4 50%,#bef264 75%,#6ee7b7);
  --sh:0 1px 2px rgba(0,0,0,.45),0 16px 32px -12px rgba(0,0,0,.7);--glow:rgba(52,211,153,.4);
  --page:linear-gradient(180deg,#052418 0%,#04170f 45%,#030f0a 100%);--navbg:rgba(6,26,18,.9);--soft:rgba(52,211,153,.14);--soft2:rgba(45,212,191,.1);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);background:var(--page) fixed;min-height:100%}
html,body{margin:0;color:var(--ink);font:600 16px/1.42 Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:transparent;min-height:100vh}
/* живой фон: мягкие изумрудные, бирюзовые и лаймовые сияния */
body::before,body::after{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;transition:opacity .6s ease;will-change:transform}
body::before{background:radial-gradient(38% 32% at 16% 16%,rgba(16,185,129,.62),transparent 70%),radial-gradient(36% 30% at 86% 12%,rgba(20,184,166,.5),transparent 70%),radial-gradient(42% 36% at 82% 82%,rgba(163,230,53,.46),transparent 70%),radial-gradient(38% 32% at 10% 88%,rgba(52,211,153,.5),transparent 70%);animation:drift 28s ease-in-out infinite alternate}
body::after{opacity:0;background:radial-gradient(38% 32% at 16% 16%,rgba(16,185,129,.46),transparent 70%),radial-gradient(36% 30% at 84% 10%,rgba(45,212,191,.36),transparent 70%),radial-gradient(40% 34% at 80% 84%,rgba(132,204,22,.24),transparent 70%),radial-gradient(38% 32% at 12% 90%,rgba(6,148,100,.3),transparent 70%);animation:drift 32s ease-in-out infinite alternate-reverse}
html[data-theme=dark] body::before{opacity:0}html[data-theme=dark] body::after{opacity:1}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) rotate(0) scale(1)}to{transform:translate3d(3%,3%,0) rotate(9deg) scale(1.1)}}
@keyframes shine{from{background-position:0% 0}to{background-position:150% 0}}
@keyframes shineb{from{background-position:0 0,0% 0}to{background-position:0 0,150% 0}}
@keyframes sweep{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@keyframes fill{from{width:0}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pop{from{transform:scale(.92);opacity:0}}

#app{max-width:520px;margin:0 auto;padding:12px 14px calc(104px + env(safe-area-inset-bottom))}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0 12px;color:var(--g2)}
h2{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:20px 0 8px;color:var(--g2)}
.card h2{margin-top:0}
/* переливающийся зелёный текст заголовков */
.brand,.sh h2,.view>h1:not([style]){background:var(--irid-t);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shine 10s linear infinite}
.top{display:flex;align-items:center;gap:8px}.top b{font-size:19px;font-weight:800;flex:1}
.back,.ib{border:0;background:var(--card);color:var(--ink);border-radius:14px;width:40px;height:40px;font-size:19px;box-shadow:var(--sh);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ib{border-radius:50%;width:42px;height:42px}
.center{text-align:center}.mute{color:var(--mute);font-size:14px;font-weight:600}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}

/* ---- плитки меню: переливающаяся рамка ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;padding:16px 8px;text-align:center;font:800 15px Nunito,system-ui,sans-serif;color:var(--ink);min-height:98px;border:1.5px solid transparent;background:linear-gradient(var(--cs),var(--cs)) padding-box,var(--irid) border-box;background-size:auto,300% 100%;animation:shineb 12s linear infinite;box-shadow:var(--sh)}
.tile i{display:block;font-style:normal;font-size:36px;margin-bottom:4px;filter:drop-shadow(0 5px 6px rgba(6,111,77,.28))}
.tile.vip,.banner{background:linear-gradient(115deg,#fff0ac,#f6c744 30%,#ffe58a 50%,#f1bd2f 70%,#fff0ac);background-size:300% 100%;color:#3f2f00;border:1.5px solid #e6b92e;animation:shine 8s linear infinite;box-shadow:0 12px 26px -10px rgba(214,160,20,.75)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:var(--sh)}
.card.glow,.glow{box-shadow:0 14px 34px -12px var(--glow),var(--sh)}
.card.glow{border:1.5px solid transparent;background:linear-gradient(var(--cs),var(--cs)) padding-box,var(--irid) border-box;background-size:auto,300% 100%;animation:shineb 10s linear infinite}
.tipc{background:var(--goldbg)!important;border-color:rgba(214,160,20,.45)!important;animation:none!important}

/* ---- кнопки: перелив + блик ---- */
.btn{position:relative;overflow:hidden;display:block;width:100%;border:0;border-radius:18px;padding:15px;font:800 17px Nunito,system-ui,sans-serif;color:#fff;margin-top:10px;background:var(--irid-d);background-size:300% 100%;animation:shine 9s linear infinite;text-shadow:0 1px 2px rgba(0,40,25,.45);box-shadow:0 12px 24px -10px rgba(6,111,77,.75),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(0,0,0,.14);transition:transform .15s,box-shadow .25s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.42) 50%,transparent 64%);transform:translateX(-130%);animation:sweep 4.6s ease-in-out infinite;pointer-events:none}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(115deg,#f9dc72,#e8b52c 30%,#fdeea8 50%,#e8b52c 70%,#f9dc72);background-size:300% 100%;color:#3a2b00;font-size:19px;text-shadow:none;box-shadow:0 12px 24px -10px rgba(201,150,18,.8),inset 0 1px 0 rgba(255,255,255,.65)}
.btn.ghost{color:var(--g2);text-shadow:none;border:1.5px solid transparent;background:linear-gradient(var(--cs),var(--cs)) padding-box,var(--irid-d) border-box;background-size:auto,300% 100%;animation:shineb 9s linear infinite;box-shadow:var(--sh)}
.btn.ghost::after{display:none}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0;border-radius:12px}
.btn[disabled]{filter:grayscale(.7);opacity:.6;animation:none}
.banner{position:relative;display:flex;align-items:center;gap:10px;border-radius:20px;padding:14px;margin-top:12px;width:100%;font:800 15px Nunito,system-ui,sans-serif;text-align:left}
.banner small{display:block;font-weight:600;opacity:.8}.banner i{font-style:normal;font-size:34px}
input,textarea,select{width:100%;border:1.5px solid var(--line);background:var(--cs);color:var(--ink);border-radius:14px;padding:13px;font:600 16px Nunito,system-ui,sans-serif;margin-top:8px;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--g1);box-shadow:0 0 0 4px rgba(20,184,166,.22)}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

/* ---- списки ---- */
.les{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 14px;margin:8px 0;font:700 15px Nunito,system-ui,sans-serif;color:var(--ink);box-shadow:var(--sh);transition:transform .15s,box-shadow .25s,border-color .25s}
.les .n{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,rgba(52,211,153,.34),rgba(45,212,191,.2));color:var(--g2);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.n img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.les.lock{opacity:.6}.lk{opacity:.7}
.les.pick{background:linear-gradient(135deg,rgba(52,211,153,.26),rgba(163,230,53,.16));border-color:var(--g1);box-shadow:0 8px 22px -10px var(--glow)}
.tag{font-size:11px;font-weight:800;border-radius:9px;padding:3px 8px;background:linear-gradient(135deg,rgba(52,211,153,.34),rgba(45,212,191,.22));color:var(--g2);margin-left:auto;flex:none}
.tag.v{background:linear-gradient(135deg,#ffe58a,#f6c744);color:#3a2b00}
.bar{height:10px;border-radius:8px;background:rgba(10,143,102,.16);overflow:hidden;margin-top:8px}
.bar div{height:100%;border-radius:8px;background:var(--irid);background-size:300% 100%;animation:fill 1.2s ease both,shine 6s linear infinite;box-shadow:0 0 12px rgba(52,211,153,.7)}
.ava{width:92px;height:92px;border-radius:50%;margin:8px auto;display:grid;place-items:center;font:800 40px Nunito,system-ui,sans-serif;color:#fff;background:var(--irid-d);background-size:300% 100%;animation:shine 8s linear infinite;border:3px solid var(--cs);box-shadow:0 0 0 3px rgba(52,211,153,.55),0 14px 30px -8px var(--glow);position:relative}
.ava.vip{box-shadow:0 0 0 4px var(--gold),0 0 32px rgba(246,199,68,.55)}.ava s{position:absolute;right:-4px;bottom:-2px;font-size:28px;text-decoration:none}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat div{background:var(--irid-d);background-size:300% 100%;animation:shine 10s linear infinite;color:#fff;border-radius:18px;padding:13px;font-weight:600;box-shadow:0 12px 24px -12px rgba(6,111,77,.8);text-shadow:0 1px 2px rgba(0,40,25,.35)}.stat b{display:block;font-size:26px;font-weight:800}
.msg{border-radius:16px;padding:10px 12px;margin:8px 0;max-width:88%;font-size:15px}.me{background:linear-gradient(135deg,rgba(52,211,153,.4),rgba(45,212,191,.28));color:var(--ink);margin-left:auto}.ex{background:var(--card);border:1px solid var(--line)}

/* ---- нижняя панель: парящее стекло ---- */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(500px,calc(100% - 20px));display:flex;padding:6px;border-radius:28px;background:var(--navbg);border:1px solid var(--line);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 18px 40px -12px rgba(6,90,62,.5),0 2px 6px rgba(6,90,62,.12);z-index:30}
nav[hidden]{display:none}
nav button{flex:1;border:0;background:none;color:var(--mute);font:800 11px Nunito,system-ui,sans-serif;padding:2px 0 4px;position:relative}
nav button i{display:block;font-style:normal;font-size:24px;height:auto}
nav button.on{color:var(--g2)}
nav button img.ni{width:36px;height:36px;border-radius:12px;display:block;margin:0 auto 3px;opacity:.82;filter:saturate(.85);transition:transform .2s ease,box-shadow .2s ease,opacity .2s ease,filter .2s ease}
nav button.on img.ni{opacity:1;filter:none;transform:translateY(-2px) scale(1.1);box-shadow:0 0 0 2px var(--mint),0 8px 18px -4px var(--glow)}
nav button.on::after{content:"";display:block;width:20px;height:3px;margin:3px auto 0;border-radius:3px;background:var(--irid);background-size:300% 100%;animation:shine 5s linear infinite}
html[data-theme=dark] nav button img.ni{filter:brightness(.88) saturate(.9)}html[data-theme=dark] nav button.on img.ni{filter:brightness(1)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--irid-d);background-size:300% 100%;animation:shine 8s linear infinite;color:#fff;padding:11px 18px;border-radius:16px;z-index:90;max-width:90%;font-weight:800;box-shadow:0 14px 30px -10px rgba(6,90,62,.7)}.toast.err{background:var(--red);animation:none}
.load{text-align:center;padding:50px;font-size:44px}
@media(prefers-reduced-motion:no-preference){.sprout{animation:sw 1.6s ease-in-out infinite}@keyframes sw{50%{transform:rotate(-8deg) scale(1.08)}}}
.view{animation:in .4s ease both}
.tile,.btn,.les,.pl{transition:transform .15s,box-shadow .25s}.tile:active,.les:active,.pl:active{transform:scale(.96)}
.tile:hover,.pl:hover,.les:hover{box-shadow:0 14px 30px -10px var(--glow)}

/* ---- грядки, растения ---- */
.grid3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pl{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:10px 2px;font:800 12px Nunito,system-ui,sans-serif;color:var(--ink);text-align:center;box-shadow:var(--sh)}.pl i{display:block;font-style:normal;font-size:30px}
.pl i img{width:44px;height:44px;border-radius:12px;object-fit:cover;display:block;margin:0 auto 2px}
.sec{animation:in .5s both;animation-delay:var(--d);box-shadow:var(--sh),inset 4px 0 0 var(--g1)}.sec p{margin:6px 0 0;line-height:1.55}
.big{font-size:68px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 10px 12px rgba(6,111,77,.3))}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dot{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:16px}.dot.on{background:var(--gold);box-shadow:0 0 14px var(--gold)}
.opt{position:relative;overflow:visible}.opt.right{background:var(--irid-d);color:#fff;border-color:var(--mint)}.opt.wrong{background:#7a1f16;color:#fff}.sp{display:none}
.pbig{width:150px;height:150px;border-radius:24px;object-fit:cover;box-shadow:0 14px 30px -10px var(--glow);background:#fff;border:2px solid var(--cs)}
.vid{width:100%;border-radius:18px;margin:10px 0;background:#000;max-height:260px}
details summary{cursor:pointer}details p{margin:8px 0 0}
details.lh summary{cursor:pointer;list-style:none}details.lh summary::-webkit-details-marker{display:none}.lh .mute{font-weight:700}

/* ---- тесты и уроки ---- */
.qbox{background:var(--irid-d);background-size:300% 100%;animation:shine 12s linear infinite;color:#fff;border-radius:20px;padding:16px;font:800 18px/1.35 Nunito,system-ui,sans-serif;margin:14px 0 8px;box-shadow:0 14px 28px -12px rgba(6,111,77,.8);text-shadow:0 1px 2px rgba(0,40,25,.35)}
.qbox small{display:block;opacity:.85;font-weight:700;font-size:12px;letter-spacing:.1em;margin-bottom:6px}
.ans{background:var(--cs);border:1.5px solid var(--line);font-weight:600}.ans .n{background:var(--soft);color:var(--g2)}
.okc{box-shadow:var(--sh),inset 5px 0 0 var(--g1)}.badc{box-shadow:var(--sh),inset 5px 0 0 var(--red)}.okc p,.badc p{margin:6px 0 0}
html[data-theme=dark] .badc{background:rgba(120,30,25,.28)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.stat2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--sh)}.stat2 small{color:var(--mute);display:block}.stat2 b{font-size:18px}
.hrs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.hr{flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center;font-size:13px}
.wday{display:block;width:100%;text-align:left;font:600 15px Nunito,system-ui,sans-serif;color:var(--ink)}
.wd{background:var(--goldbg);border-radius:14px;padding:10px 12px;margin:8px 0}.wd b{color:var(--g2)}html[data-theme=dark] .wd b{color:#f6c744}
.hk small{display:inline-block;background:var(--soft);color:var(--g2);border-radius:9px;padding:2px 8px;font-weight:800;font-size:11px;margin-bottom:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.mchips{padding-bottom:8px;margin-bottom:6px}.mchips .chip{flex:none}
.chip{border:1.5px solid var(--line);background:var(--cs);color:var(--g2);border-radius:999px;padding:8px 15px;font:800 14px Nunito,system-ui,sans-serif;transition:transform .15s}.chip:active{transform:scale(.95)}
.chip.on{background:var(--irid-d);background-size:300% 100%;animation:shine 8s linear infinite;color:#fff;border-color:transparent;text-shadow:0 1px 2px rgba(0,40,25,.35);box-shadow:0 8px 16px -8px rgba(6,111,77,.8)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tg{flex:none;width:54px;height:31px;border-radius:20px;border:0;background:rgba(120,150,135,.4);position:relative;transition:background .25s}
.tg i{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:left .22s;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.tg.on{background:var(--irid-d);background-size:300% 100%;animation:shine 8s linear infinite}.tg.on i{left:26px}

/* ---- главная ---- */
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}.hdr .logo{font-size:38px}.brand{font:800 26px Nunito,system-ui,sans-serif;line-height:1}.hdr>div:nth-child(2){flex:1}
.hero{position:relative;margin:-12px -14px 0;border-radius:0 0 32px 32px;padding:14px 18px 26px;min-height:256px;color:#fff;overflow:hidden;box-shadow:0 22px 40px -18px rgba(4,80,56,.7);background:linear-gradient(100deg,rgba(3,70,48,.94) 0%,rgba(6,111,77,.68) 46%,rgba(13,148,136,.1) 100%),url(/img/hero.jpg) center 35%/cover,linear-gradient(135deg,#066f4d,#14b8a6)}
.hero>*{position:relative;z-index:1}
.hero::before{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;z-index:2;background:var(--irid);background-size:300% 100%;animation:shine 6s linear infinite;box-shadow:0 0 18px rgba(163,230,53,.8)}
.hero::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.2) 44%,rgba(190,242,100,.22) 52%,rgba(94,234,212,.16) 60%,transparent 74%);background-size:260% 100%;animation:sheen 8s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%{background-position:130% 0}100%{background-position:-60% 0}}
.hero .hdr{margin-bottom:26px}.hero .hdr .logo{font-size:32px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}.hero .hdr .sub{color:#fff;font-weight:800;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.hero .ib{background:rgba(255,255,255,.9);color:#0b2a1f;border-color:transparent}
.hero h1{color:#fff;margin:0 0 6px;font-size:30px;text-shadow:0 2px 12px rgba(0,0,0,.5)}.hero p{margin:0 0 14px;max-width:58%;font-size:16px;line-height:1.35;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.hbtn{border:0;border-radius:16px;padding:12px 22px;font:800 16px Nunito,system-ui,sans-serif;color:#0b3d2a;background:linear-gradient(115deg,#d9fbe8,#bef264 50%,#d9fbe8);background-size:300% 100%;animation:shine 6s linear infinite;box-shadow:0 10px 22px -8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.7)}
.hart{position:absolute;right:14px;bottom:8px;font-size:48px;opacity:.9}
.qt{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0}.qt button{padding:0;border:0;background:none;border-radius:20px;box-shadow:0 12px 22px -10px rgba(6,100,70,.55);transition:transform .15s,box-shadow .2s}
.qt button:active{transform:scale(.95)}.qt img{width:100%;display:block;border-radius:20px}html[data-theme=dark] .qt img{filter:brightness(.92) saturate(.95)}
.sh{display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px}.sh h2{margin:0;font-size:21px}.lnk{border:0;background:none;font:800 14px Nunito,system-ui,sans-serif;color:var(--g2)}
.tk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:8px 0;box-shadow:var(--sh)}.tk b{display:block}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--g1);background:var(--cs);box-shadow:0 0 0 4px rgba(52,211,153,.16);transition:background .2s,transform .15s}.chk:active{background:var(--mint);transform:scale(.9)}
.wcard{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);border-radius:22px;padding:14px;margin:12px 0;background:linear-gradient(135deg,rgba(125,211,252,.4),rgba(52,211,153,.34) 55%,rgba(190,242,100,.3));font:600 14px Nunito,system-ui,sans-serif;color:var(--ink);text-align:left;box-shadow:var(--sh)}
html[data-theme=dark] .wcard{background:linear-gradient(135deg,rgba(40,100,140,.4),rgba(16,120,90,.4) 55%,rgba(80,130,20,.3))}
.wcard .wi{font-size:40px}.wcard .wt{font-size:32px;font-weight:800}.wcard .adv{flex:1;border-left:1px solid var(--line);padding-left:12px;font-size:13px}

/* ---- календарь ---- */
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0}.mg b{text-align:center;font-size:12px;color:var(--mute)}
.md{border:2px solid transparent;border-radius:13px;background:var(--card);padding:4px 0;text-align:center;font:700 12px Nunito,system-ui,sans-serif;color:var(--ink);min-height:48px}.md i{display:block;font-style:normal;font-size:20px;line-height:1.1}
.md.g{border-color:rgba(52,211,153,.8);background:linear-gradient(180deg,var(--card),var(--soft))}.md.r{border-color:#e08a80;background:rgba(224,138,128,.14)}.md.t{box-shadow:0 0 0 2px var(--g2),0 8px 16px -6px var(--glow)}.md.sel{background:var(--soft);color:var(--g2)}

/* ---- праздник и подсказки ---- */
.cele{position:fixed;inset:0;z-index:20;background:rgba(2,30,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px;animation:in .25s both}
.cbox{background:var(--cs);color:var(--ink);border-radius:26px;padding:28px 24px;text-align:center;max-width:340px;border:1.5px solid transparent;background:linear-gradient(var(--cs),var(--cs)) padding-box,var(--irid) border-box;background-size:auto,300% 100%;animation:pop .3s ease both,shineb 8s linear infinite;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.ci{font-size:52px}.cbox h2{margin:8px 0}.cbox p{color:var(--mute);margin:0 0 8px}
.rays,.crown{display:none}
#tour{position:fixed;inset:0;z-index:70}
#tour .spot{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(2,26,18,.7),0 0 0 3px #bef264,0 0 22px 4px rgba(190,242,100,.7);transition:all .3s;pointer-events:none}
#tour .dim{position:fixed;inset:0;background:rgba(2,26,18,.7)}
#tour .tb{position:fixed;left:12px;right:12px;max-width:500px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;animation:in .3s both}
#tour .mole{width:92px;height:92px;flex:none;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.45);animation:bob 1.4s ease-in-out infinite;background:#fff}
#tour .bub{flex:1;background:#fff;color:#0b2a1f;border-radius:20px;padding:12px 14px;box-shadow:0 14px 30px -8px rgba(0,0,0,.5);font-weight:700;line-height:1.35}
#tour .tr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}#tour .tr .mute{color:#47685a}
#tour .x{position:fixed;top:12px;right:12px;z-index:72;border:0;border-radius:18px;padding:8px 14px;font:800 14px Nunito,system-ui,sans-serif;color:#0b2a1f;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.35)}

/* ---- заставка ---- */
#splash{position:fixed;inset:0;z-index:60;display:grid;place-content:center;justify-items:center;background:radial-gradient(circle at 50% 32%,#0f7a57,#064a35 52%,#021c13);transition:opacity .5s;overflow:hidden}#splash.hide{opacity:0;pointer-events:none}
#splash::before{content:"";position:absolute;inset:-30%;background:radial-gradient(30% 26% at 25% 25%,rgba(94,234,212,.35),transparent 70%),radial-gradient(30% 26% at 78% 72%,rgba(190,242,100,.28),transparent 70%);animation:drift 9s ease-in-out infinite alternate}
#splash>*{position:relative}
#splash svg{width:150px;height:170px;filter:drop-shadow(0 0 24px rgba(110,231,183,.55))}.stem{stroke:#6ee7b7;stroke-width:6;fill:none;stroke-linecap:round;stroke-dasharray:70;stroke-dashoffset:70;animation:grow 1s .2s ease-out forwards}@keyframes grow{to{stroke-dashoffset:0}}
.lf{transform-box:fill-box;transform:scale(0);animation:leaf .7s ease-out forwards}.l1{transform-origin:right bottom;animation-delay:.9s}.l2{transform-origin:left bottom;animation-delay:1.1s}@keyframes leaf{to{transform:scale(1)}}
.l1 path{fill:#34d399}.l2 path{fill:#bef264}
.sp-t{font:800 42px Nunito,system-ui;margin-top:6px;opacity:0;background:linear-gradient(100deg,#6ee7b7,#bef264 30%,#5eead4 60%,#6ee7b7);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:fade .6s 1.2s forwards,shine 5s linear infinite}.sp-s{color:#a7f3d0;font-weight:600;opacity:0;animation:fade .6s 1.4s forwards}@keyframes fade{to{opacity:1}}
.sp-bar{width:150px;height:6px;border-radius:4px;background:rgba(255,255,255,.16);margin-top:22px;overflow:hidden}.sp-bar i{display:block;height:100%;width:0;background:var(--irid);background-size:300% 100%;animation:bar 1.9s ease-out forwards,shine 3s linear infinite}@keyframes bar{to{width:100%}}

/* ---- переливающаяся рамка у карточек (маска, фон остаётся прозрачным) ---- */
.card,.les,.tk,.pl,.stat2,.hr,.wcard,.md{position:relative}
.card::before,.les::before,.tk::before,.pl::before,.stat2::before,.hr::before,.wcard::before{content:"";position:absolute;inset:-1px;padding:1.5px;border-radius:inherit;background:var(--irid);background-size:300% 100%;opacity:.55;pointer-events:none;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.card.glow::before{display:none}
.tile:hover::before,.les:active::before,.card:active::before{opacity:1}
.card,.tk,.stat2,.hr{background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(236,253,245,.8))}
html[data-theme=dark] :is(.card,.tk,.stat2,.hr){background:linear-gradient(135deg,rgba(16,52,38,.88),rgba(10,36,26,.82))}
html[data-theme=dark] :is(.card,.les,.tk,.pl,.stat2,.hr,.wcard)::before{opacity:.7}
.card.tipc,.card.okc,.card.badc{background:var(--goldbg)}
.card.okc{background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(220,252,231,.85))}html[data-theme=dark] .card.okc{background:rgba(16,70,45,.7)}
.card.badc{background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(254,226,226,.85))}

/* ---- настройки доступности ---- */
.nomo *,.nomo body::before,.nomo::before{animation:none!important;transition:none!important}body.nomo::before,body.nomo::after{animation:none!important}
body.fs-s #app{zoom:.92}body.fs-l #app{zoom:1.12}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="splash"><svg viewBox="0 0 120 130" aria-hidden="true"><ellipse cx="60" cy="114" rx="36" ry="9" fill="#7a5532"/><path class="stem" d="M60 112 C60 92 60 72 60 52"/><g class="lf l1"><path d="M60 64 C40 62 27 48 25 32 C44 32 58 43 60 64Z" fill="#43a047"/></g><g class="lf l2"><path d="M60 52 C80 50 93 36 95 20 C76 20 62 31 60 52Z" fill="#66bb6a"/></g></svg><div class="sp-t">Садовест</div><div class="sp-s">Ваш помощник в мире растений</div><div class="sp-bar"><i></i></div></div>
<div id="app"><div class="load"><span class="sprout" style="display:inline-block">🌱</span></div></div>
<nav id="nav" hidden></nav>
<script src="/enc.js"></script>
<script src="/data.js"></script>
<script src="/data2.js"></script>
<script src="/data3.js"></script>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=t=>new Date(t).toLocaleDateString('ru-RU');
let me=null,stack=[],cur='home';
const ACH={first:['🌱','Первый урок'],five:['📚','5 уроков'],garden:['🪴','Свой огород'],week:['📅','7 дней с нами'],promo:['🏷️','Промокод'],vip:['👑','VIP-садовод']};
async function api(action,data={}){
  const r=await fetch('/api/rpc',{method:'POST',headers:{'content-type':'application/json','x-init':tg?.initData||''},body:JSON.stringify({action,...data})});
  const j=await r.json().catch(()=>({error:'Ошибка сети'}));if(!r.ok)throw new Error(j.error||'Ошибка');return j;
}
function toast(t,err){const e=document.createElement('div');e.className='toast'+(err?' err':'');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}
const act=async(fn)=>{try{return await fn()}catch(e){toast(e.message,1)}};
const head=(t,back=1,x='')=>`<div class="top">${back&&!root.includes(cur)?'<button class="back" aria-label="Назад" onclick="back()">‹</button>':''}<b>${t}</b>${x}<button class="back" aria-label="Поиск" onclick="go('search','')">🔍</button>${me?.vip?'<span style="font-size:26px">👑</span>':''}</div>`;
const tabs=[['home','<img class="ni" src="/img/nav/home.webp" alt="">','Главная'],['garden','<img class="ni" src="/img/nav/garden.webp" alt="">','Грядки'],['calendar','<img class="ni" src="/img/nav/calendar.webp" alt="">','Календарь'],['lessons','<img class="ni" src="/img/nav/lessons.webp" alt="">','Уроки'],['more','<img class="ni" src="/img/nav/more.webp" alt="">','Ещё']];
function go(v,a){if(v==='lesson')LS=null;stack.push([cur,curArg]);cur=v;curArg=a;draw()}
let curArg;
function back(){const p=stack.pop();if(p){cur=p[0];curArg=p[1];if(cur==='lesson'&&LS&&LS.res)LS=null;draw()}}
function tab(v){stack=[];cur=v;curArg=null;draw()}
const root=['home','garden','calendar','lessons','more'];
let DRN=0;
async function draw(){
  const my=++DRN;
  if(me&&!me.profile)cur='onboard';
  const nav=$('#nav');nav.hidden=!me||!root.includes(cur);
  nav.innerHTML=tabs.map(([v,i,t])=>`<button class="${v===cur?'on':''}" onclick="tab('${v}')"><i>${i}</i>${t}</button>`).join('');
  window.scrollTo(0,0);
  if(tg){tg.BackButton[stack.length?'show':'hide']();}
  let html;
  try{html='<div class="view">'+await V[cur](curArg)+'</div>'}catch(e){html=head('Садовест',0)+`<div class="card center">${esc(e.message)}<button class="btn" onclick="init()">Повторить</button></div>`}
  if(my!==DRN)return; // пока грузился этот экран, пользователь уже ушёл на другой
  app.innerHTML=html;
}
tg?.BackButton.onClick(back);
const V={
home:()=>`<h1>Привет, ${esc(me.name)}!</h1>
<div class="grid">
${[['lessons','📖','Уроки'],['garden','🪴','Мой огород'],['vip','👑','VIP-клуб','vip'],['support','🛟','Поддержка'],['calendar','🗓️','Календарь']].map(([v,i,t,c])=>`<button class="tile ${c||''}" onclick="go('${v}')"><i>${i}</i>${t}</button>`).join('')}
</div>
${me.vip?'':`<button class="banner" onclick="go('vip')"><i>👑</i><span>VIP-доступ<small>Больше знаний. Больше возможностей.</small></span></button>`}
${me.admin?`<button class="btn ghost" onclick="go('admin')">⚙️ Панель администратора</button>`:''}`,

async lessons(){
  const {items}=await api('lessons');const row=l=>`<button class="les ${l.locked?'lock':''}" onclick="${l.locked?"go('vip')":`go('lesson',${l.id})`}"><span class="n">${l.locked?'🔒':l.done?'✅':l.id}</span><span>${esc(l.title)}</span><span class="tag ${l.free?'':'v'}">${l.free?'Бесплатно':'VIP'}</span></button>`;
  return head('Уроки',0)+`<div class="mute">Доступно уроков: ${me.vip?items.length:items.filter(l=>l.free).length} из ${items.length}</div><h2>Бесплатные уроки</h2>`+items.filter(l=>l.free).map(row).join('')+`<h2>VIP-уроки (${items.filter(l=>!l.free).length})</h2>`+items.filter(l=>!l.free).map(row).join('')},

async lesson(id){const l=await api('lesson',{id});
  return head('Урок')+`<div class="card"><h2 style="margin-top:0">${esc(l.title)}</h2><p>${esc(l.text)}</p></div><button class="btn" ${l.done?'disabled':''} onclick="finish(${l.id})">${l.done?'✅ Пройден':'Отметить пройденным'}</button>`},

vip:()=>`${head('VIP-клуб')}<div class="card" style="background:linear-gradient(135deg,#fff3c9,#ffe28a);color:#4a3600;border-color:#e3b82f"><div class="center" style="font-size:56px">👑</div><h1 class="center" style="color:#4a3600;margin:0">VIP-клуб</h1><p class="center" style="margin:2px 0 14px">Больше знаний — больше возможностей</p>
${['📚 Расширенные VIP-уроки','🛟 Профессиональная поддержка','⭐ Эксклюзивные материалы','🏅 Золотой значок'].map(t=>`<p style="margin:8px 0;font-weight:800">${t}</p>`).join('')}
${me.vip?`<p class="center" style="font-weight:800">VIP активен до ${fd(me.vip_until)}</p>`:''}
${me.discount?`<p class="center" style="font-weight:800">🏷 Ваша скидка ${me.discount.value}% (промокод ${esc(me.discount.code)})<br><small style="font-weight:600">Укажите этот промокод при оплате</small></p>`:''}
<button class="btn gold" onclick="buy()">${me.vip?'Продлить VIP':'Купить VIP'}</button></div>${promoBox()}`,

promo:()=>head('Промокод')+promoBox(),
async support(){
  if(!me.vip)return head('VIP-эксперт')+`<div class="card center"><div style="font-size:44px">🔒</div><b>Поддержка доступна только VIP-пользователям</b><div class="mute">Ответ в течение 1–2 часов</div><button class="btn gold" onclick="go('vip')">Открыть VIP</button></div>`;
  const {items}=await api('tickets');
  return head('VIP-эксперт')+(items.length?items.slice().reverse().map(t=>`<div class="msg me">${esc(t.text)}<div class="mute">${fd(t.created)}</div></div>${t.reply?`<div class="msg ex"><b>Эксперт 👑</b><br>${esc(t.reply)}</div>`:'<div class="mute center">Ждём ответа эксперта…</div>'}`).join(''):'<div class="card center">Опишите проблему с растением — эксперт ответит в течение 1–2 часов.</div>')+`<textarea id="tx" rows="3" maxlength="1000" placeholder="Напишите сообщение…"></textarea><button class="btn" onclick="sendT()">Отправить</button>`},


async garden(){const {items}=await api('plants');return head('Мой огород')+(items.length?items.map(p=>`<div class="card"><div class="row"><b>🌿 ${esc(p.name)}</b><span class="mute" style="text-align:right">полив каждые ${p.every} дн.</span></div><div class="mute">Последний полив: ${fd(p.last)}</div><div class="row" style="margin-top:8px"><button class="btn sm" onclick="plant('plant_water',${p.id})">💧 Полил(а)</button><button class="btn sm ghost" onclick="plant('plant_del',${p.id})">Удалить</button></div></div>`).join(''):'<div class="card center">Добавьте первое растение, и мы напомним о поливе</div>')+`<div class="card"><input id="pn" maxlength="40" placeholder="Название (например, томаты)"><input id="pe" type="number" min="1" max="60" value="3" aria-label="Полив раз в N дней"><div class="mute">Поливать раз в N дней</div><button class="btn" onclick="addPlant()">Добавить растение</button></div>`},

async calendar(){const {items}=await api('plants');const l=items.map(p=>({...p,next:p.last+p.every*864e5})).sort((a,b)=>a.next-b.next);
  return head('Календарь')+(l.length?l.map(p=>`<div class="card row"><b>💧 ${esc(p.name)}</b><span style="text-align:right;color:${p.next<Date.now()?'var(--red)':'inherit'}">${p.next<Date.now()?'Пора!':fd(p.next)}</span></div>`).join(''):'<div class="card center">Добавьте растения в «Мой огород» — здесь появится расписание полива</div>')+`<div class="card row"><span>🔔 Напоминания в Telegram</span><button class="btn sm ${me.notify?'':'ghost'}" onclick="toggleN()">${me.notify?'Включены':'Выключены'}</button></div>`},


profile(){return head('Профиль')+`<div class="center"><div class="ava ${me.vip?'vip':''}">${esc([...me.name][0]||'С').toUpperCase()}${me.vip?'<s>👑</s>':''}</div><h2 style="margin:4px 0">${esc(me.name)}</h2>${me.vip?`<div class="tag v" style="display:inline-block;font-size:14px;padding:6px 14px">VIP активен до ${fd(me.vip_until)}</div>`:'<div class="mute">Обычный аккаунт</div>'}</div>
<div class="card">Пройдено уроков: ${me.done} из ${me.total}<div class="bar"><div style="width:${Math.round(me.done/me.total*100)}%"></div></div></div>
<div class="stat" style="grid-template-columns:1fr 1fr 1fr"><div class="center"><b>${me.days}</b>дней</div><div class="center"><b>${me.ach.length}</b>наград</div><div class="center"><b>${me.coins}</b>монет</div></div>
<h2>Достижения</h2><div class="grid">${Object.entries(ACH).map(([k,[i,t]])=>`<div class="card center" style="margin:0;opacity:${me.ach.includes(k)?1:.35}"><div style="font-size:30px">${i}</div>${t}</div>`).join('')}</div>
<button class="btn" onclick="go('promo')">Ввести промокод</button>${me.admin?`<button class="btn ghost" onclick="go('admin')">⚙️ Панель администратора</button>`:''}`},

async admin(){
  const [s,p,t]=await Promise.all([api('admin_stats'),api('admin_promos'),api('admin_tickets')]);
  return head('Администратор')+`<div class="stat"><div><b>${s.users}</b>Пользователи</div><div><b>${s.vip}</b>VIP</div><div><b>${s.tickets}</b>Тикеты</div><div><b>${s.promos}</b>Промокоды</div></div>
<h2>Промокоды</h2>${p.items.map(x=>`<div class="card"><b>${esc(x.code)}</b> <span class="mute">${{vip:'VIP '+x.value+' дн.',coins:x.value+' монет',discount:'скидка '+x.value+'%'}[x.type]}</span><div class="mute">Использовано: ${x.used}${x.limit?' / '+x.limit:''} • ${x.expires?'до '+fd(x.expires):'без срока'} • ${x.active?'активен':'отключён'}</div><div class="row" style="margin-top:8px"><button class="btn sm ghost" onclick="adm('admin_promo_toggle',{code:'${esc(x.code)}'})">${x.active?'Отключить':'Включить'}</button><button class="btn sm ghost" onclick="if(confirm('Удалить?'))adm('admin_promo_del',{code:'${esc(x.code)}'})">Удалить</button></div></div>`).join('')||'<div class="mute">Пока нет</div>'}
<div class="card"><b>Создать промокод</b><input id="ac" placeholder="КОД (A-Z, 0-9)"><select id="at"><option value="vip">VIP (дни)</option><option value="coins">Монеты</option><option value="discount">Скидка %</option></select><input id="av" type="number" placeholder="Значение"><input id="al" type="number" placeholder="Лимит активаций (0 — без лимита)"><input id="ad" type="number" placeholder="Срок действия, дней (0 — бессрочно)"><button class="btn" onclick="newPromo()">Создать</button></div>
<div class="card"><b>Выдать VIP</b><input id="gu" type="number" placeholder="Telegram ID"><input id="gd" type="number" placeholder="Дней" value="30"><button class="btn" onclick="grant()">Выдать</button></div>
<h2>Тикеты</h2>${t.items.map(x=>`<div class="card"><b>#${x.id} ${esc(x.name)}</b> <span class="mute">${x.status==='open'?'открыт':'закрыт'}</span><p>${esc(x.text)}</p>${x.reply?`<div class="msg ex">${esc(x.reply)}</div>`:`<input id="r${x.id}" placeholder="Ответ"><button class="btn sm" style="margin-top:8px" onclick="reply(${x.id})">Ответить</button>`}</div>`).join('')||'<div class="mute">Нет тикетов</div>'}`}
};

const SYN=29.530588853,NEW0=Date.UTC(2000,0,6,18,14),SIGNS=['Овен','Телец','Близнецы','Рак','Лев','Дева','Весы','Скорпион','Стрелец','Козерог','Водолей','Рыбы'],MOONS=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];

const mInfo=d=>{const ms=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12),a=mAge(ms),sg=mSign(ms),edge=a<1||a>SYN-1||Math.abs(a-SYN/2)<1,fert=['Рак','Скорпион','Рыбы'].includes(sg),mid=['Телец','Весы','Козерог'].includes(sg);
  return {a,sg,edge,emoji:MOONS[Math.floor(a/SYN*8+.5)%8],ph:edge?(a<2||a>SYN-2?'Новолуние':'Полнолуние'):a<SYN/2?'Растущая Луна':'Убывающая Луна',cls:edge?'r':(fert?'g':''),

  sgn:fert?'Знак плодородный: хороший день для посева и посадки.':mid?'Знак со средней плодородностью: допустимо сеять и сажать.':'Знак малоплодородный: лучше полоть, рыхлить и обрабатывать от вредителей.'}};
const MNG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

<div class="card glow center"><div class="big">${sel.emoji}</div><h2 style="margin:0">${Math.min(MD,days)} ${MNG[MM]}: ${sel.ph}</h2><div class="mute">Возраст Луны ${sel.a.toFixed(1)} сут. • Луна в знаке: ${sel.sg}</div></div><div class="card"><b>🌱 Рекомендация</b><p>${sel.adv}</p><p>${sel.sgn}</p></div>${nxt?`<div class="card tipc">Ближайшее: ${nxt}</div>`:''}<div class="mute center">🟩 благоприятные дни, 🟥 неблагоприятные (новолуние и полнолуние). Расчёт приблизительный: календарь — ориентир, а не закон.</div>`};
// ---- v9: фото растений, экскурсия землеройки ----
const PIMG={'Томат':'tomato','Огурец':'cucumber','Картофель':'potato','Морковь':'carrot','Капуста':'cabbage','Лук':'onion','Чеснок':'garlic','Перец':'pepper','Баклажан':'eggplant','Свёкла':'beet','Кабачок':'zucchini','Редис':'radish','Тыква':'pumpkin','Яблоня':'apple','Колоновидная яблоня':'apple','Груша':'pear','Виноград':'grape','Дыня':'melon','Вишня':'cherry','Слива':'plum','Абрикос':'apricot','Персик':'peach','Клубника':'strawberry','Земляника садовая':'strawberry','Малина':'raspberry','Ежевика':'blackberry','Голубика':'blueberry','Смородина':'currant','Красная смородина':'currant','Крыжовник':'gooseberry','Облепиха':'seabuckthorn','Кукуруза':'corn','Горох':'pea','Брокколи':'broccoli','Шпинат':'spinach','Салат':'lettuce','Петрушка':'parsley','Базилик':'basil','Мята':'mint','Укроп':'dill','Лук-батун':'scallion','Руккола':'arugula','Кинза':'cilantro','Тимьян':'thyme'};
const pimg=(n,c='')=>PIMG[n]?`<img class="${c}" src="/img/plants/${PIMG[n]}.jpg" alt="${esc(n)}" loading="lazy">`:'';
V.plants=()=>{const P=S2.pt==='Растения',src=(P?PLANTS:PESTS).map((x,i)=>[x,i]).filter(([x])=>P||(S2.pt==='Болезни'?x.k==='Болезнь':x.k==='Вредитель')),pre=P?'p':'d',free=src.filter(([x,i])=>FREE_ENC.has(pre+i)).length;let last='';
  return head('Энциклопедия')+chips('pt',['Растения','Болезни','Вредители'])+`<div class="mute">Всего: ${src.length}${me.vip?'':` • бесплатно доступно ${free}, остальные — с VIP`}${P?` • с фото: ${src.filter(([x])=>PIMG[x.n]).length}`:''}</div>`+src.sort((a,b)=>a[0].n.localeCompare(b[0].n,'ru')).map(([x,i])=>{const L=x.n[0].toUpperCase(),h=L!==last?(last=L,`<h2>${L}</h2>`):'',ok=encOk(pre+i);return h+`<button class="les ${ok?'':'lk'}" onclick="${ok?`go('${P?'plantinfo':'pestinfo'}',${i})`:"go('vip')"}"><span class="n">${ok?(P&&pimg(x.n)||x.e):'🔒'}</span><span>${esc(x.n)}<div class="mute">${x.k}</div></span><span class="tag ${ok?'':'v'}">${ok?(me.vip?'':'Бесплатно'):'VIP'}</span></button>`}).join('')};
// полный текст закрытых записей приходит с сервера и только для VIP
const ENCC={};
async function encItem(t,i){const L=t==='p'?PLANTS:PESTS;if(!L[i].lock)return L[i];return ENCC[t+i]||(ENCC[t+i]=(await api('enc_get',{t,i})).item)}
V.plantinfo=async i=>{if(!encOk('p'+i))return V.vip();const p=await encItem('p',i),im=pimg(p.n,'pbig')||`<div class="big">${p.e}</div>`;
  return head(p.n,1,bm('p:'+i))+`<div class="card glow center">${im}<h2 style="margin:6px 0 0">${p.n}</h2><div class="mute">${p.k} • ${p.s} • полив каждые ${p.w} дн.</div></div><div class="card"><b>О растении</b><p>${p.i}</p><b>Когда сажать</b><p>${p.t}</p><b>Советы</b>${p.c.map(x=>`<p>✅ ${x}</p>`).join('')}</div><button class="btn" onclick="addP(${i})">Добавить в мой огород</button>`};
V.pestinfo=async i=>{if(!encOk('d'+i))return V.vip();const p=await encItem('d',i);return head(p.n,1,bm('d:'+i))+`<div class="card glow center"><div class="big">${p.e}</div><h2 style="margin:0">${p.n}</h2><div class="mute">${p.k}</div></div><div class="card"><b>Признаки</b><p>${p.i}</p><b>Как бороться</b>${p.c.map(x=>`<p>✅ ${x}</p>`).join('')}</div>`};
// экскурсия с землеройкой
const TOUR=[
 {x:'Привет! Я землеройка-садовод. Покажу, где что находится в СадоВесте — это займёт меньше минуты.'},
 {s:'.hbtn',x:'Вот тут твои грядки: добавляй растения, и я напомню, когда их поливать.'},
 {s:'nav button:nth-child(4)',x:'Здесь ты будешь проходить уроки. Первые 10 бесплатные, после каждого — небольшой тест.'},
 {s:'.banner',opt:1,x:'А здесь покупается VIP-доступ: все уроки, вся энциклопедия, PDF-шпаргалки и помощь экспертов.'},
 {s:'nav button:nth-child(3)',x:'Календарь огородника: что и когда сеять, поливать и подкармливать. Там же лунный календарь.'},
 {s:'nav button:nth-child(5)',x:'В «Ещё» спрятано много полезного: тесты, лайфхаки, словарь, энциклопедия, погода, VIP и настройки.'},
 {s:'.ib[aria-label="Поиск"]',x:'А это поиск: он найдёт урок, растение, болезнь или лайфхак.'},
 {x:'Вот и всё! Начни с первого бесплатного урока. Экскурсию можно повторить в «Ещё» → Настройки.'}];
let TI=0,TSL=[];
function startTour(n=0){if(cur==='home'&&!document.querySelector('.hbtn')&&n<25)return setTimeout(()=>startTour(n+1),150);TSL=TOUR.filter(s=>!s.opt||document.querySelector(s.s));TI=0;let o=document.getElementById('tour');if(!o){o=document.createElement('div');o.id='tour';document.body.append(o)}tourShow()}
function tourShow(){const o=document.getElementById('tour'),s=TSL[TI];if(!o)return;if(!s)return tourEnd();
  const el=s.s&&document.querySelector(s.s);
  if(el&&!(el.closest&&el.closest('nav')))el.scrollIntoView({block:'center'});else if(!el)window.scrollTo(0,0);
  const r=el?el.getBoundingClientRect():null,H=innerHeight,up=r&&r.top>H/2,pos=r?(up?`bottom:${Math.max(12,Math.min(H-170,H-r.top+16))}px`:`top:${Math.max(70,Math.min(H-200,r.bottom+16))}px`):'top:28%';
  o.innerHTML=(r?`<div class="spot" style="left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px"></div>`:'<div class="dim"></div>')+`<button class="x" onclick="tourEnd()">✕ Закрыть</button><div class="tb" style="${pos}"><img class="mole" src="/img/mole.jpg" alt="Землеройка"><div class="bub"><div>${s.x}</div><div class="tr"><button class="btn sm ghost" onclick="tourEnd()">Пропустить</button><span class="mute">${TI+1}/${TSL.length}</span><button class="btn sm" onclick="TI++;tourShow()">${TI===TSL.length-1?'Готово':'Дальше'}</button></div></div></div>`}
function tourEnd(){const o=document.getElementById('tour');if(o)o.remove();SET.toured=true;saveSet();try{window.scrollTo(0,0)}catch{}}
function maybeTour(){if(SET.toured||!me||!me.profile||cur!=='home'||document.getElementById('tour'))return;startTour()}
V.more=()=>head('Ещё',0)+[['tests','📝','Тесты'],['moon','🌙','Лунный календарь'],['hacks','💡','Лайфхаки'],['dict','📖','Словарь огородника'],['plants','🌿','Энциклопедия: растения, болезни, вредители'],['weather','🌦️','Погода для огорода'],['board','🏆','Рейтинг'],['marks','🔖','Закладки'],['files','📄','Материалы (PDF)'],['vip','👑','VIP-клуб'],['support','🛟','Поддержка'],['profile','👤','Профиль'],['settings','⚙️','Настройки'],['faq','❓','Вопросы и ответы'],['tour','🐹','Экскурсия с землеройкой'],...(me.admin?[['admin','🛠','Панель администратора']]:[])].map(([v,e,t])=>`<button class="les" onclick="${v==='tour'?"tab('home');setTimeout(startTour,700)":`go('${v}')`}"><span class="n">${e}</span><span>${t}</span><span style="margin-left:auto">›</span></button>`).join('');
// ---- v10: компактная админ-панель по вкладкам ----
S2.at='Обзор';S2.bt='Все';let AUQ='',BT='',ARM=false;
const dd=t=>t?new Date(t).toLocaleDateString('ru-RU'):'—';
const ADM={
 async 'Обзор'(){const o=await api('admin_overview'),c=(n,t)=>`<div><b>${n}</b>${t}</div>`;
  return `<div class="stat">${c(o.users,'Пользователи')}${c(o.vip,'VIP сейчас')}${c(o.active,'Активны сегодня')}${c(o.active7,'Активны за 7 дней')}${c(o.new7,'Новые за 7 дней')}${c(o.lessonsDone,'Пройдено уроков')}${c(o.testsDone,'Пройдено тестов')}${c(o.tickets,'Открытые тикеты')}</div>`
  +(o.top.length?`<div class="card"><b>🔥 Популярные уроки</b>${o.top.map((x,i)=>`<div class="row" style="margin-top:6px"><span style="flex:4">${i+1}. ${esc(x.title)}</span><b style="text-align:right">${x.n}</b></div>`).join('')}</div>`:'')
  +`<div class="card mute">Промокодов: ${o.promos}.</div>`},
 async 'Промокоды'(){const {items}=await api('admin_promos');
  return `<details class="card"><summary><b>➕ Создать промокод</b></summary><input id="ac" placeholder="КОД (A–Z, 0–9)"><select id="at"><option value="vip">VIP (дни)</option><option value="coins">Монеты</option><option value="discount">Скидка %</option></select><input id="av" type="number" placeholder="Значение"><input id="al" type="number" placeholder="Лимит активаций (0 — без лимита)"><input id="ad" type="number" placeholder="Срок, дней (0 — бессрочно)"><button class="btn" onclick="newPromo()">Создать</button></details>`
  +(items.length?items.map(x=>`<div class="card row"><div style="flex:3"><b>${esc(x.code)}</b> <span class="mute">${{vip:'VIP '+x.value+' дн.',coins:x.value+' монет',discount:'скидка '+x.value+'%'}[x.type]}</span><div class="mute">Использовано ${x.used}${x.limit?' из '+x.limit:''} • ${x.expires?'до '+fd(x.expires):'бессрочно'} • ${x.active?'активен':'выключен'}</div></div><button class="btn sm ghost" style="flex:none" onclick="adm('admin_promo_toggle',{code:'${esc(x.code)}'})">${x.active?'Выкл':'Вкл'}</button><button class="btn sm ghost" style="flex:none" onclick="if(confirm('Удалить промокод?'))adm('admin_promo_del',{code:'${esc(x.code)}'})">✕</button></div>`).join(''):'<div class="card center mute">Промокодов пока нет</div>')},
 async 'Люди'(){const {items,total}=await api('admin_users',{q:AUQ}),now=Date.now();
  return `<div class="card"><div class="row"><input id="uq" value="${esc(AUQ)}" placeholder="Telegram ID или имя" onkeydown="if(event.key==='Enter')findU()"><button class="btn sm" style="flex:none" onclick="findU()">Найти</button></div><div class="mute">Всего пользователей: ${total}. ${AUQ?'Результаты поиска.':'Показаны последние новые.'}</div></div>`
  +(items.length?items.map(u=>`<div class="card"><div class="row"><b style="flex:3">${esc(u.name)} <span class="mute">#${u.id}</span></b><span class="tag ${u.vip_until>now?'v':''}" style="flex:none">${u.vip_until>now?'VIP до '+dd(u.vip_until):'без VIP'}</span></div><div class="mute">Серия ${u.streak} • монет ${u.coins} • уроков ${u.done} • дней ${u.days} • с ${dd(u.joined)}</div><div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn sm ghost" onclick="uAct('${u.id}','vip+',30)">+30 дн.</button><button class="btn sm ghost" onclick="uAct('${u.id}','vip+',365)">+1 год</button><button class="btn sm ghost" onclick="uAct('${u.id}','vip-',0)">Снять VIP</button><button class="btn sm ghost" onclick="uAct('${u.id}','coins',100)">+100 🪙</button></div></div>`).join(''):'<div class="card center mute">Никого не найдено</div>')},
 async 'Тикеты'(){const {items}=await api('admin_tickets'),op=items.filter(x=>x.status==='open'),cl=items.filter(x=>x.status!=='open'),card=x=>`<div class="card"><b>#${x.id} ${esc(x.name)}</b> <span class="mute">${dd(x.created)}${x.photo?' • 📷 фото':''}</span><p style="margin:6px 0">${esc(x.text)}</p>${x.reply?`<div class="msg ex">${esc(x.reply)}</div>`:`<input id="r${x.id}" placeholder="Ответ"><button class="btn sm" style="margin-top:8px" onclick="reply(${x.id})">Ответить</button>`}</div>`;
  return (op.length?op.map(card).join(''):'<div class="card center mute">Открытых тикетов нет</div>')+(cl.length?`<details class="card"><summary><b>Закрытые (${cl.length})</b></summary>${cl.map(card).join('')}</details>`:'')},
 async 'Рейтинг'(){const {items}=await api('lb');window.LBI=items;
  return `<details class="card"><summary><b>➕ Добавить или изменить участника</b></summary><input id="ln" maxlength="24" placeholder="Ник"><input id="ls" type="number" placeholder="Рейтинг"><button class="btn" onclick="adm('admin_lb_set',{nick:$('#ln').value,score:$('#ls').value})">Сохранить</button></details>`
  +(items.length?items.map((x,i)=>`<div class="card row"><span style="flex:3">${i+1}. ${esc(x.nick)}</span><b style="flex:none">${x.score}</b><button class="btn sm ghost" style="flex:none" onclick="adm('admin_lb_del',{nick:LBI[${i}].nick})">✕</button></div>`).join(''):'<div class="card center mute">Список пуст</div>')},
 async 'Рассылка'(){const o=await api('admin_overview'),n={'Все':o.users,'VIP':o.vip,'Без VIP':o.users-o.vip}[S2.bt];
  return `<div class="card"><b>📣 Рассылка через бота</b><textarea id="bt" rows="4" maxlength="1000" oninput="BT=this.value" placeholder="Текст сообщения">${esc(BT)}</textarea><div class="mute">Кому отправить:</div><div class="chips">${['Все','VIP','Без VIP'].map(x=>`<button class="chip ${S2.bt===x?'on':''}" onclick="S2.bt='${x}';ARM=false;draw()">${x}</button>`).join('')}</div>`
  +(ARM?`<div class="card tipc">Отправить сообщение ${n} получателям?<div class="row" style="margin-top:8px"><button class="btn sm" onclick="sendBc()">Да, отправить</button><button class="btn sm ghost" onclick="ARM=false;draw()">Отмена</button></div></div>`:`<button class="btn" onclick="armBc()">Отправить (${n})</button>`)
  +`<div class="mute">Сообщение получат только те, кто запускал бота и не заблокировал его.</div></div>`}
};
const findU=()=>{AUQ=$('#uq').value.trim();draw()};
const uAct=(uid,a,value)=>act(async()=>{if(a==='vip-'&&!confirm('Снять VIP у пользователя?'))return;await api('admin_user_act',{uid,act:a,value});toast('Готово');draw()});
const armBc=()=>{BT=(($('#bt')&&$('#bt').value)||BT).trim();if(BT.length<3)return toast('Введите текст сообщения',1);ARM=true;draw()};
const sendBc=()=>act(async()=>{const text=BT.trim(),target={'Все':'all','VIP':'vip','Без VIP':'free'}[S2.bt];let off=0,sent=0,fail=0,total=0;ARM=false;toast('Отправка…');do{const r=await api('admin_broadcast',{text,target,offset:off});sent+=r.sent;fail+=r.failed;total=r.total;off=r.next}while(off!=null);BT='';toast(`Отправлено ${sent} из ${total}${fail?`, ошибок ${fail}`:''}`);draw()});
V.admin=async()=>{let body;try{body=await ADM[S2.at]()}catch(e){body=`<div class="card">${esc(e.message)}</div>`}
  return head('Админ-панель')+`<div class="hrs mchips">${Object.keys(ADM).map(x=>`<button class="chip ${S2.at===x?'on':''}" onclick="S2.at='${x}';draw()">${x}</button>`).join('')}</div>`+body};
// ---- v11: вкладка «Бот» в админ-панели (приветствие) ----
let BG=null,BB=null;
const botPrev=(t,n='Анна')=>esc(t).replace(/\{name\}/g,`<b>${esc(n)}</b>`).replace(/\n/g,'<br>');
ADM['Бот']=async()=>{const c=await api('admin_bot_get');if(BG===null)BG=c.greeting;if(BB===null)BB=c.button;
  return `<div class="card"><b>🤖 Приветствие бота (команда /start)</b><textarea id="bg" rows="6" maxlength="1000" oninput="BG=this.value;$('#bpv').innerHTML=botPrev(BG)">${esc(BG)}</textarea><div class="mute">Вместо <b>{name}</b> подставится имя пользователя. Пустые строки и эмодзи можно использовать.</div><b style="display:block;margin-top:10px">Текст кнопки под приветствием</b><input id="bb" maxlength="40" value="${esc(BB)}" oninput="BB=this.value"><button class="btn" onclick="saveBot()">Сохранить</button><div class="row" style="margin-top:8px"><button class="btn sm ghost" onclick="testBot()">Прислать мне для проверки</button><button class="btn sm ghost" onclick="resetBot()">Сбросить на стандартное</button></div></div><div class="card"><b>Так это увидит пользователь</b><div class="msg ex" id="bpv" style="max-width:100%;margin-top:8px">${botPrev(BG)}</div></div>`};
const saveBot=()=>act(async()=>{await api('admin_bot_set',{greeting:BG,button:BB});toast('Приветствие сохранено');BG=BB=null;draw()});
const testBot=()=>act(async()=>{await api('admin_bot_test',{greeting:BG,button:BB});toast('Черновик отправлен вам в чат (в рабочий текст не сохранён)')});
const resetBot=()=>act(async()=>{await api('admin_bot_reset');BG=BB=null;toast('Возвращено стандартное приветствие');draw()});
const _sp=document.getElementById&&document.getElementById('splash');
Promise.all([init(),new Promise(r=>setTimeout(r,SET.motion?2100:300))]).finally(()=>{if(_sp){_sp.classList.add('hide');setTimeout(()=>_sp.remove(),600)};setTimeout(maybeTour,700)});
</script>
</body>
</html>
