<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Садовест</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#eef8ee;--card:#fff;--ink:#17311f;--mute:#5d7a66;--g1:#2e8b3d;--g2:#14532d;--line:#d5ead7;--gold:#f6c744;--gold2:#b8860b;--goldbg:#fff3c9;--red:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1f14;--card:#16301e;--ink:#e8f5ea;--mute:#9bb8a2;--line:#24472f;--goldbg:#3a3213}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:12px 14px calc(88px + env(safe-area-inset-bottom))}
h1{font-size:24px;font-weight:800;margin:6px 0 12px;color:var(--g2)}@media(prefers-color-scheme:dark){h1{color:#8fe3a0}}
h2{font-size:18px;font-weight:800;margin:18px 0 8px}
.top{display:flex;align-items:center;gap:8px}.top b{font-size:19px;font-weight:800;flex:1}
.back{border:0;background:var(--card);border-radius:12px;width:38px;height:38px;font-size:20px;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:16px 8px;text-align:center;font:800 15px Nunito;color:var(--ink);min-height:96px}
.tile i{display:block;font-style:normal;font-size:36px;margin-bottom:4px}
.tile.vip,.banner{background:linear-gradient(135deg,#ffe58a,#f6c744);color:#4a3600;border-color:#e3b82f}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font:800 17px Nunito;color:#fff;background:linear-gradient(#37a449,var(--g2));margin-top:10px}
.btn.gold{background:linear-gradient(#ffd966,#d9a21b);color:#3d2d00;font-size:19px}.btn.ghost{background:var(--card);color:var(--g1);border:1.5px solid var(--g1)}.btn.sm{width:auto;padding:8px 14px;font-size:14px;margin:0;border-radius:12px}
.banner{display:flex;align-items:center;gap:10px;border-radius:20px;padding:14px;margin-top:12px;border:1px solid #e3b82f;width:100%;font:800 15px Nunito;text-align:left}
.banner small{display:block;font-weight:600;opacity:.8}.banner i{font-style:normal;font-size:34px}
input,textarea,select{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px;font:600 16px Nunito;margin-top:8px}
.les{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;margin:8px 0;font:700 15px Nunito;color:var(--ink)}
.les .n{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;flex:none}
.les.lock{opacity:.6}.tag{font-size:11px;font-weight:800;border-radius:8px;padding:2px 7px;background:#d9f2dc;color:var(--g2);margin-left:auto;flex:none}.tag.v{background:var(--gold);color:#4a3600}
.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}.bar div{height:100%;background:linear-gradient(90deg,#37a449,#8fe3a0)}
.ava{width:92px;height:92px;border-radius:50%;margin:8px auto;display:grid;place-items:center;font:800 40px Nunito;color:#fff;background:linear-gradient(#37a449,var(--g2));position:relative}
.ava.vip{box-shadow:0 0 0 4px var(--gold)}.ava s{position:absolute;right:-4px;bottom:-2px;font-size:28px;text-decoration:none}
.center{text-align:center}.mute{color:var(--mute);font-size:14px;font-weight:600}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat div{background:linear-gradient(135deg,#37a449,var(--g2));color:#fff;border-radius:16px;padding:12px;font-weight:600}.stat b{display:block;font-size:26px;font-weight:800}
.msg{border-radius:14px;padding:10px 12px;margin:8px 0;max-width:88%;font-size:15px}.me{background:#d9f2dc;color:#17311f;margin-left:auto}.ex{background:var(--card);border:1px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
nav button{flex:1;border:0;background:none;color:var(--mute);font:800 11px Nunito;padding:4px}nav button i{display:block;font-style:normal;font-size:24px}nav button.on{color:var(--g1)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--g2);color:#fff;padding:10px 16px;border-radius:14px;z-index:9;max-width:90%;font-weight:800}.toast.err{background:var(--red)}
.load{text-align:center;padding:50px;font-size:44px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.sprout{animation:sw 1.6s ease-in-out infinite}@keyframes sw{50%{transform:rotate(-8deg) scale(1.08)}}}
.view{animation:in .4s ease both}@keyframes in{from{opacity:0;transform:translateY(14px)}}
.tile,.btn,.les,.pl{transition:transform .15s,box-shadow .25s}.tile:active,.btn:active,.les:active,.pl:active{transform:scale(.95)}
.tile:hover,.pl:hover{box-shadow:0 0 20px rgba(55,164,73,.5)}.glow{box-shadow:0 0 24px rgba(55,164,73,.35)}
.tile.vip,.btn.gold,.banner{box-shadow:0 0 22px rgba(246,199,68,.6);animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 36px rgba(246,199,68,1)}}
.grid .tile{animation:in .5s both}.tile:nth-child(odd){animation-delay:.05s}.tile:nth-child(even){animation-delay:.13s}
.bar div{animation:fill 1.2s ease both}@keyframes fill{from{width:0}}
.grid3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pl{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 2px;font:800 12px Nunito;color:var(--ink);text-align:center}.pl i{display:block;font-style:normal;font-size:30px}
.sec{border-left:4px solid var(--g1);animation:in .5s both;animation-delay:var(--d)}.sec p{margin:6px 0 0;line-height:1.55}.tipc{background:var(--goldbg);border-color:#e3b82f}
.big{font-size:68px;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dot{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:16px}.dot.on{background:var(--gold);box-shadow:0 0 14px var(--gold)}
.opt{position:relative;overflow:visible}.opt.right{background:linear-gradient(135deg,#37a449,#14532d);color:#fff;border-color:#8fe3a0;animation:r3d .9s ease both;box-shadow:0 0 28px #37a449}
@keyframes r3d{0%{transform:perspective(500px) rotateY(0)}50%{transform:perspective(500px) rotateY(180deg) translateZ(50px) scale(1.08)}100%{transform:perspective(500px) rotateY(360deg)}}
.opt.wrong{background:#7a1f16;color:#fff;animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sp{position:absolute;left:50%;top:50%;font-style:normal;pointer-events:none;animation:spark .9s ease-out forwards}@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.cele{position:fixed;inset:0;z-index:20;background:radial-gradient(#5a4300,#000c);display:grid;place-content:center;text-align:center;color:#fff;padding:24px;overflow:hidden;animation:in .4s both}
.cele>*{position:relative}.cele .crown{font-size:110px;animation:spin3d 3s ease-in-out infinite;filter:drop-shadow(0 0 30px gold)}@keyframes spin3d{to{transform:perspective(500px) rotateY(360deg)}}
.rays{position:absolute!important;inset:-50%;background:repeating-conic-gradient(#f6c74440 0 10deg,transparent 10deg 20deg);animation:rot 20s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.cele i{position:absolute;top:-30px;font-style:normal;animation:fall 3s linear infinite}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app"><div class="load"><span class="sprout" style="display:inline-block">🌱</span></div></div>
<nav id="nav" hidden></nav>
<script src="/data.js"></script>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=t=>new Date(t).toLocaleDateString('ru-RU');
let me=null,stack=[],cur='home';
const ACH={first:['🌱','Первый урок'],five:['📚','5 уроков'],garden:['🪴','Свой огород'],week:['📅','7 дней с нами'],promo:['🏷️','Промокод'],vip:['👑','VIP-садовод']};
async function api(action,data={}){
  const r=await fetch('/api/rpc',{method:'POST',headers:{'content-type':'application/json','x-init':tg?.initData||''},body:JSON.stringify({action,...data})});
  const j=await r.json().catch(()=>({error:'Ошибка сети'}));if(!r.ok)throw new Error(j.error||'Ошибка');return j;
}
function toast(t,err){const e=document.createElement('div');e.className='toast'+(err?' err':'');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}
const act=async(fn)=>{try{return await fn()}catch(e){toast(e.message,1)}};
const head=(t,back=1)=>`<div class="top">${back?'<button class="back" aria-label="Назад" onclick="back()">‹</button>':''}<b>🌱 ${t}</b>${me?.vip?'<span style="font-size:26px">👑</span>':''}</div>`;
const tabs=[['home','🏠','Главная'],['lessons','📖','Уроки'],['community','💬','Сообщество'],['profile','👤','Профиль']];
function go(v,a){stack.push([cur,curArg]);cur=v;curArg=a;draw()}
let curArg;
function back(){const p=stack.pop();if(p){cur=p[0];curArg=p[1];draw()}}
function tab(v){stack=[];cur=v;curArg=null;draw()}
const root=['home','lessons','community','profile'];
async function draw(){
  const nav=$('#nav');nav.hidden=!me||!root.includes(cur);
  nav.innerHTML=tabs.map(([v,i,t])=>`<button class="${v===cur?'on':''}" onclick="tab('${v}')"><i>${i}</i>${t}</button>`).join('');
  window.scrollTo(0,0);
  if(tg){tg.BackButton[stack.length?'show':'hide']();}
  try{app.innerHTML='<div class="view">'+await V[cur](curArg)+'</div>'}catch(e){app.innerHTML=head('Садовест',0)+`<div class="card center">${esc(e.message)}<button class="btn" onclick="init()">Повторить</button></div>`}
}
tg?.BackButton.onClick(back);
const V={
home:()=>`<h1>Привет, ${esc(me.name)}!</h1>
<div class="grid">
${[['lessons','📖','Уроки'],['garden','🪴','Мой огород'],['community','💬','Сообщество'],['shop','🧺','Магазин'],['vip','👑','VIP-клуб','vip'],['support','🛟','Поддержка'],['calendar','🗓️','Календарь'],['games','🧩','Игры']].map(([v,i,t,c])=>`<button class="tile ${c||''}" onclick="${v==='community'?'tab':'go'}('${v}')"><i>${i}</i>${t}</button>`).join('')}
</div>
${me.vip?'':`<button class="banner" onclick="go('vip')"><i>👑</i><span>VIP-доступ<small>Больше знаний. Больше возможностей.</small></span></button>`}
${me.admin?`<button class="btn ghost" onclick="go('admin')">⚙️ Панель администратора</button>`:''}`,

async lessons(){
  const {items}=await api('lessons');const row=l=>`<button class="les ${l.locked?'lock':''}" onclick="${l.locked?"go('vip')":`go('lesson',${l.id})`}"><span class="n">${l.locked?'🔒':l.done?'✅':l.id}</span><span>${esc(l.title)}</span><span class="tag ${l.free?'':'v'}">${l.free?'Бесплатно':'VIP'}</span></button>`;
  return head('Уроки',0)+`<div class="mute">Доступно уроков: ${me.vip?items.length:items.filter(l=>l.free).length} из ${items.length}</div><h2>Бесплатные уроки</h2>`+items.filter(l=>l.free).map(row).join('')+`<h2>VIP-уроки (${items.filter(l=>!l.free).length})</h2>`+items.filter(l=>!l.free).map(row).join('')},

async lesson(id){const l=await api('lesson',{id});
  return head('Урок')+`<div class="card"><h2 style="margin-top:0">${esc(l.title)}</h2><p>${esc(l.text)}</p></div><button class="btn" ${l.done?'disabled':''} onclick="finish(${l.id})">${l.done?'✅ Пройден':'Отметить пройденным'}</button>`},

vip:()=>`${head('VIP-клуб')}<div class="card" style="background:linear-gradient(135deg,#fff3c9,#ffe28a);color:#4a3600;border-color:#e3b82f"><div class="center" style="font-size:56px">👑</div><h1 class="center" style="color:#4a3600;margin:0">VIP-клуб</h1><p class="center" style="margin:2px 0 14px">Больше знаний — больше возможностей</p>
${['📚 100 уроков','🛟 Профессиональная поддержка','⭐ Эксклюзивные материалы','🏅 Золотой значок'].map(t=>`<p style="margin:8px 0;font-weight:800">${t}</p>`).join('')}
${me.vip?`<p class="center" style="font-weight:800">VIP активен до ${fd(me.vip_until)}</p>`:''}
<button class="btn gold" onclick="buy()">${me.vip?'Продлить VIP':'Купить VIP'}</button></div>${promoBox()}`,

promo:()=>head('Промокод')+promoBox(),
async support(){
  if(!me.vip)return head('VIP-эксперт')+`<div class="card center"><div style="font-size:44px">🔒</div><b>Поддержка доступна только VIP-пользователям</b><div class="mute">Ответ в течение 1–2 часов</div><button class="btn gold" onclick="go('vip')">Открыть VIP</button></div>`;
  const {items}=await api('tickets');
  return head('VIP-эксперт')+(items.length?items.slice().reverse().map(t=>`<div class="msg me">${esc(t.text)}<div class="mute">${fd(t.created)}</div></div>${t.reply?`<div class="msg ex"><b>Эксперт 👑</b><br>${esc(t.reply)}</div>`:'<div class="mute center">Ждём ответа эксперта…</div>'}`).join(''):'<div class="card center">Опишите проблему с растением — эксперт ответит в течение 1–2 часов.</div>')+`<textarea id="tx" rows="3" maxlength="1000" placeholder="Напишите сообщение…"></textarea><button class="btn" onclick="sendT()">Отправить</button>`},

community:()=>head('Сообщество',0)+`<div class="card center"><div style="font-size:52px">💬</div><b>Общайтесь с садоводами</b><div class="mute">Делитесь фото, задавайте вопросы, находите друзей</div><button class="btn" onclick="link('${esc(me.cfg.community)}')">Открыть сообщество</button></div>`,
shop:()=>head('Магазин')+`<div class="card center"><div style="font-size:48px">🧺</div><b>Скоро открытие</b><div class="mute">Копите монеты за уроки и игры: у вас сейчас 🪙 ${me.coins}</div></div>`,

async garden(){const {items}=await api('plants');return head('Мой огород')+(items.length?items.map(p=>`<div class="card"><div class="row"><b>🌿 ${esc(p.name)}</b><span class="mute" style="text-align:right">полив раз в ${p.every} дн.</span></div><div class="mute">Последний полив: ${fd(p.last)}</div><div class="row" style="margin-top:8px"><button class="btn sm" onclick="plant('plant_water',${p.id})">💧 Полил(а)</button><button class="btn sm ghost" onclick="plant('plant_del',${p.id})">Удалить</button></div></div>`).join(''):'<div class="card center">Добавьте первое растение, и мы напомним о поливе</div>')+`<div class="card"><input id="pn" maxlength="40" placeholder="Название (например, томаты)"><input id="pe" type="number" min="1" max="60" value="3" aria-label="Полив раз в N дней"><div class="mute">Поливать раз в N дней</div><button class="btn" onclick="addPlant()">Добавить растение</button></div>`},

async calendar(){const {items}=await api('plants');const l=items.map(p=>({...p,next:p.last+p.every*864e5})).sort((a,b)=>a.next-b.next);
  return head('Календарь')+(l.length?l.map(p=>`<div class="card row"><b>💧 ${esc(p.name)}</b><span style="text-align:right;color:${p.next<Date.now()?'var(--red)':'inherit'}">${p.next<Date.now()?'Пора!':fd(p.next)}</span></div>`).join(''):'<div class="card center">Добавьте растения в «Мой огород» — здесь появится расписание полива</div>')+`<div class="card row"><span>🔔 Напоминания в Telegram</span><button class="btn sm ${me.notify?'':'ghost'}" onclick="toggleN()">${me.notify?'Включены':'Выключены'}</button></div>`},

games(){const q=[['Какой овощ называют «золотым яблоком»?',['Томат','Огурец','Редис'],0],['Что нужно растениям для фотосинтеза?',['Только вода','Свет','Холод'],1],['Чем мульчируют грядки?',['Соломой','Песком из пустыни','Льдом'],0]];window.QZ={q,i:0,s:0};setTimeout(quiz,0);return head('Игры')+'<div id="qz"></div>'},

profile(){return head('Профиль',0)+`<div class="center"><div class="ava ${me.vip?'vip':''}">${esc(me.name[0]||'С').toUpperCase()}${me.vip?'<s>👑</s>':''}</div><h2 style="margin:4px 0">${esc(me.name)}</h2>${me.vip?`<div class="tag v" style="display:inline-block;font-size:14px;padding:6px 14px">VIP активен до ${fd(me.vip_until)}</div>`:'<div class="mute">Обычный аккаунт</div>'}</div>
<div class="card">Пройдено уроков: ${me.done} из ${me.total}<div class="bar"><div style="width:${Math.round(me.done/me.total*100)}%"></div></div></div>
<div class="stat" style="grid-template-columns:1fr 1fr 1fr"><div class="center"><b>${me.days}</b>дней</div><div class="center"><b>${me.ach.length}</b>наград</div><div class="center"><b>${me.coins}</b>монет</div></div>
<h2>Достижения</h2><div class="grid">${Object.entries(ACH).map(([k,[i,t]])=>`<div class="card center" style="margin:0;opacity:${me.ach.includes(k)?1:.35}"><div style="font-size:30px">${i}</div>${t}</div>`).join('')}</div>
<button class="btn" onclick="go('promo')">Ввести промокод</button>${me.admin?`<button class="btn ghost" onclick="go('admin')">⚙️ Панель администратора</button>`:''}`},

async admin(){
  const [s,p,t]=await Promise.all([api('admin_stats'),api('admin_promos'),api('admin_tickets')]);
  return head('Администратор')+`<div class="stat"><div><b>${s.users}</b>Пользователи</div><div><b>${s.vip}</b>VIP</div><div><b>${s.tickets}</b>Тикеты</div><div><b>${s.promos}</b>Промокоды</div></div>
<h2>Промокоды</h2>${p.items.map(x=>`<div class="card"><b>${esc(x.code)}</b> <span class="mute">${{vip:'VIP '+x.value+' дн.',coins:x.value+' монет',discount:'скидка '+x.value+'%'}[x.type]}</span><div class="mute">Использовано: ${x.used}${x.limit?' / '+x.limit:''} • ${x.expires?'до '+fd(x.expires):'без срока'} • ${x.active?'активен':'отключён'}</div><div class="row" style="margin-top:8px"><button class="btn sm ghost" onclick="adm('admin_promo_toggle',{code:'${esc(x.code)}'})">${x.active?'Отключить':'Включить'}</button><button class="btn sm ghost" onclick="if(confirm('Удалить?'))adm('admin_promo_del',{code:'${esc(x.code)}'})">Удалить</button></div></div>`).join('')||'<div class="mute">Пока нет</div>'}
<div class="card"><b>Создать промокод</b><input id="ac" placeholder="КОД (A-Z, 0-9)"><select id="at"><option value="vip">VIP (дни)</option><option value="coins">Монеты</option><option value="discount">Скидка %</option></select><input id="av" type="number" placeholder="Значение"><input id="al" type="number" placeholder="Лимит активаций (0 — без лимита)"><input id="ad" type="number" placeholder="Срок действия, дней (0 — бессрочно)"><button class="btn" onclick="newPromo()">Создать</button></div>
<div class="card"><b>Выдать VIP</b><input id="gu" type="number" placeholder="Telegram ID"><input id="gd" type="number" placeholder="Дней" value="30"><button class="btn" onclick="grant()">Выдать</button></div>
<h2>Тикеты</h2>${t.items.map(x=>`<div class="card"><b>#${x.id} ${esc(x.name)}</b> <span class="mute">${x.status==='open'?'открыт':'закрыт'}</span><p>${esc(x.text)}</p>${x.reply?`<div class="msg ex">${esc(x.reply)}</div>`:`<input id="r${x.id}" placeholder="Ответ"><button class="btn sm" style="margin-top:8px" onclick="reply(${x.id})">Ответить</button>`}</div>`).join('')||'<div class="mute">Нет тикетов</div>'}`}
};
const promoBox=()=>`<div class="card"><b>Промокод</b><input id="pc" maxlength="20" autocapitalize="characters" placeholder="Введите промокод"><button class="btn" onclick="usePromo()">Активировать</button></div>`;
function link(u){if(!u)return toast('Ссылка пока не настроена',1);u.startsWith('https://t.me')&&tg?tg.openTelegramLink(u):tg?tg.openLink(u):open(u)}
const buy=()=>link(me.cfg.buy);
const refresh=async()=>{me=await api('me')};
const usePromo=()=>act(async()=>{const was=me.vip;const r=await api('promo',{code:$('#pc').value});await refresh();if(!was&&me.vip)celebrate('👑','Добро пожаловать в VIP!',r.msg);else toast('✅ '+r.msg);tab('profile')});
const finish=id=>act(async()=>{const b=me.ach.length;await api('done',{id});await refresh();me.ach.length>b?celebrate('🏅','Новое достижение!',ACH[me.ach[me.ach.length-1]][1]):toast('Урок пройден! +2 🪙');back()});
const sendT=()=>act(async()=>{await api('ticket_new',{text:$('#tx').value});toast('Отправлено');draw()});
const addPlant=()=>act(async()=>{await api('plant_add',{name:$('#pn').value,every:$('#pe').value});await refresh();draw()});
const plant=(a,id)=>act(async()=>{await api(a,{id});await refresh();draw()});
const toggleN=()=>act(async()=>{await api('notify',{on:!me.notify});await refresh();draw()});
const adm=(a,d)=>act(async()=>{await api(a,d);draw()});
const newPromo=()=>adm('admin_promo_new',{code:$('#ac').value,type:$('#at').value,value:$('#av').value,limit:$('#al').value,days:$('#ad').value});
const grant=()=>act(async()=>{await api('admin_grant',{uid:$('#gu').value,days:$('#gd').value});toast('VIP выдан')});
const reply=id=>adm('admin_reply',{id,text:$('#r'+id).value});
async function init(){
  if(!tg?.initData){app.innerHTML=head('Садовест',0)+'<div class="card center"><div style="font-size:44px">📱</div>Откройте приложение через Telegram-бота «Садовест»</div>';return}
  try{await refresh();draw()}catch(e){app.innerHTML=head('Садовест',0)+`<div class="card center">${esc(e.message)}<button class="btn" onclick="init()">Повторить</button></div>`}
}
// ---- v2: уроки, каталог, игры, эффекты ----
function celebrate(icon,title,sub){const o=document.createElement('div');o.className='cele';
  o.innerHTML=`<div class="rays"></div><div class="crown">${icon}</div><h1 style="color:#ffe58a">${esc(title)}</h1><p>${esc(sub)}</p><button class="btn gold" onclick="this.parentNode.remove()">Отлично!</button>`;
  for(let i=0;i<40;i++){const p=document.createElement('i');p.textContent=['✨','⭐','🌿','👑','🪙'][i%5];p.style.cssText=`left:${Math.random()*100}%;animation-delay:${Math.random()*2}s;font-size:${14+Math.random()*18}px`;o.append(p)}
  document.body.append(o)}
function burst(el){for(let i=0;i<10;i++){const s=document.createElement('i');s.className='sp';s.textContent=['✨','⭐','🌿'][i%3];const a=i/10*6.28;s.style.setProperty('--x',Math.cos(a)*70+'px');s.style.setProperty('--y',Math.sin(a)*50+'px');el.append(s)}}
V.lesson=async id=>{const l=await api('lesson',{id});
  return head('Урок')+`<div class="card glow"><h2 style="margin:0 0 6px">${esc(l.title)}</h2><div class="mute">${esc(l.intro)}</div></div>`+l.sections.map(([h,t],i)=>`<div class="card sec" style="--d:${i*.1}s"><b>${['🌱','💧','☀️','🛡️','📌'][i%5]} ${esc(h)}</b><p>${esc(t)}</p></div>`).join('')+`<div class="card tipc">💡 <b>Совет эксперта:</b> ${esc(l.tip)}</div><button class="btn" ${l.done?'disabled':''} onclick="finish(${l.id})">${l.done?'✅ Пройден':'Отметить пройденным'}</button>`};
const plIdx=name=>PLANTS.findIndex(p=>name.includes(p.n));
V.garden=async()=>{const {items}=await api('plants');
  return head('Мой огород')+`<h2>Каталог растений</h2><div class="grid3">${PLANTS.map((p,i)=>`<button class="pl" onclick="go('plantinfo',${i})"><i>${p.e}</i>${p.n}</button>`).join('')}</div><h2>Мои растения</h2>`+(items.length?items.map(p=>{const k=plIdx(p.name);return `<div class="card"><div class="row"><b>${esc(p.name)}</b><span class="mute" style="text-align:right">полив раз в ${p.every} дн.</span></div><div class="mute">Последний полив: ${fd(p.last)}</div><div class="row" style="margin-top:8px"><button class="btn sm" onclick="plant('plant_water',${p.id})">💧 Полил(а)</button>${k>=0?`<button class="btn sm ghost" onclick="go('plantinfo',${k})">Советы</button>`:''}<button class="btn sm ghost" onclick="plant('plant_del',${p.id})">Удалить</button></div></div>`}).join(''):'<div class="card center">Выберите растение в каталоге выше</div>')+`<div class="card"><b>Своё растение</b><input id="pn" maxlength="40" placeholder="Название"><input id="pe" type="number" min="1" max="60" value="3" aria-label="Полив раз в N дней"><div class="mute">Поливать раз в N дней</div><button class="btn" onclick="addPlant()">Добавить</button></div>`};
V.plantinfo=i=>{const p=PLANTS[i];return head(p.n)+`<div class="card glow center"><div class="big">${p.e}</div><h2 style="margin:0">${p.n}</h2><div class="mute">${p.k} • ${p.s} • полив раз в ${p.w} дн.</div></div><div class="card"><b>О растении</b><p>${p.i}</p><b>Когда сажать</b><p>${p.t}</p><b>Советы</b>${p.c.map(x=>`<p>✅ ${x}</p>`).join('')}</div><button class="btn" onclick="addP(${i})">Добавить в мой огород</button>`};
const addP=i=>act(async()=>{const p=PLANTS[i];await api('plant_add',{name:p.e+' '+p.n,every:p.w});await refresh();toast('Добавлено в огород 🌿');back()});
V.games=()=>{const q=me.quiz,days=q.days.map(d=>`<span class="dot ${d?'on':''}">${d?'⭐':''}</span>`).join('');
  if(q.today)return head('Игры')+`<div class="card center glow"><div class="big">🏆</div><b>Сегодня вы уже играли</b><div class="mute">Новый тест — завтра. Играть можно раз в день, 7 раз в неделю.</div><div class="dots">${days}</div></div>`;
  const d=Math.floor(Date.now()/864e5),qs=[...Array(5)].map((_,i)=>QUIZ[(d*5+i)%QUIZ.length]).map(([t,o])=>({t,o:o.map((x,k)=>[x,k===0]).sort(()=>Math.random()-.5)}));
  window.QZ={q:qs,i:0,s:0,lock:0};setTimeout(quiz,0);return head('Игры')+`<div class="mute center">Тест дня • дни недели</div><div class="dots">${days}</div><div id="qz"></div>`};
function quiz(){const z=QZ,el=$('#qz');if(!el)return;
  if(z.i>=z.q.length){el.innerHTML=`<div class="card center glow"><div class="big">🏆</div><b>Верно: ${z.s} из ${z.q.length}</b><button class="btn" onclick="reward()">Забрать монеты</button></div>`;return}
  const q=z.q[z.i];el.innerHTML=`<div class="mute">Вопрос ${z.i+1} из ${z.q.length}</div><div class="card glow"><b>${q.t}</b></div>`+q.o.map(([x],k)=>`<button class="les opt" id="o${k}" onclick="ans(${k})">${x}</button>`).join('')}
function ans(k){const z=QZ;if(z.lock)return;z.lock=1;const q=z.q[z.i],ok=q.o[k][1],b=$('#o'+k);b.classList.add(ok?'right':'wrong');
  if(ok){z.s++;burst(b)}else q.o.forEach(([,g],j)=>g&&$('#o'+j).classList.add('right'));setTimeout(()=>{z.i++;z.lock=0;quiz()},1200)}
function reward(){act(async()=>{await api('quiz',{score:QZ.s});await refresh();QZ.s===QZ.q.length?celebrate('🏆','Идеально!','5 из 5 — вы настоящий садовод'):toast(`+${QZ.s} 🪙`);tab('home')})}
init();
</script>
</body>
</html>
