<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Садовест</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#eef8ee;--card:#fff;--ink:#17311f;--mute:#5d7a66;--g1:#2e8b3d;--g2:#14532d;--line:#d5ead7;--gold:#f6c744;--gold2:#b8860b;--goldbg:#fff3c9;--red:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1f14;--card:#16301e;--ink:#e8f5ea;--mute:#9bb8a2;--line:#24472f;--goldbg:#3a3213}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:12px 14px calc(88px + env(safe-area-inset-bottom))}
h1{font-size:24px;font-weight:800;margin:6px 0 12px;color:var(--g2)}@media(prefers-color-scheme:dark){h1{color:#8fe3a0}}
h2{font-size:18px;font-weight:800;margin:18px 0 8px}
.top{display:flex;align-items:center;gap:8px}.top b{font-size:19px;font-weight:800;flex:1}
.back{border:0;background:var(--card);border-radius:12px;width:38px;height:38px;font-size:20px;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:16px 8px;text-align:center;font:800 15px Nunito;color:var(--ink);min-height:96px}
.tile i{display:block;font-style:normal;font-size:36px;margin-bottom:4px}
.tile.vip,.banner{background:linear-gradient(135deg,#ffe58a,#f6c744);color:#4a3600;border-color:#e3b82f}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font:800 17px Nunito;color:#fff;background:linear-gradient(#37a449,var(--g2));margin-top:10px}
.btn.gold{background:linear-gradient(#ffd966,#d9a21b);color:#3d2d00;font-size:19px}.btn.ghost{background:var(--card);color:var(--g1);border:1.5px solid var(--g1)}.btn.sm{width:auto;padding:8px 14px;font-size:14px;margin:0;border-radius:12px}
.banner{display:flex;align-items:center;gap:10px;border-radius:20px;padding:14px;margin-top:12px;border:1px solid #e3b82f;width:100%;font:800 15px Nunito;text-align:left}
.banner small{display:block;font-weight:600;opacity:.8}.banner i{font-style:normal;font-size:34px}
input,textarea,select{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px;font:600 16px Nunito;margin-top:8px}
.les{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;margin:8px 0;font:700 15px Nunito;color:var(--ink)}
.les .n{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;flex:none}
.les.lock{opacity:.6}.tag{font-size:11px;font-weight:800;border-radius:8px;padding:2px 7px;background:#d9f2dc;color:var(--g2);margin-left:auto;flex:none}.tag.v{background:var(--gold);color:#4a3600}
.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}.bar div{height:100%;background:linear-gradient(90deg,#37a449,#8fe3a0)}
.ava{width:92px;height:92px;border-radius:50%;margin:8px auto;display:grid;place-items:center;font:800 40px Nunito;color:#fff;background:linear-gradient(#37a449,var(--g2));position:relative}
.ava.vip{box-shadow:0 0 0 4px var(--gold)}.ava s{position:absolute;right:-4px;bottom:-2px;font-size:28px;text-decoration:none}
.center{text-align:center}.mute{color:var(--mute);font-size:14px;font-weight:600}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat div{background:linear-gradient(135deg,#37a449,var(--g2));color:#fff;border-radius:16px;padding:12px;font-weight:600}.stat b{display:block;font-size:26px;font-weight:800}
.msg{border-radius:14px;padding:10px 12px;margin:8px 0;max-width:88%;font-size:15px}.me{background:#d9f2dc;color:#17311f;margin-left:auto}.ex{background:var(--card);border:1px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
nav button{flex:1;border:0;background:none;color:var(--mute);font:800 11px Nunito;padding:4px}nav button i{display:block;font-style:normal;font-size:24px}nav button.on{color:var(--g1)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--g2);color:#fff;padding:10px 16px;border-radius:14px;z-index:9;max-width:90%;font-weight:800}.toast.err{background:var(--red)}
.load{text-align:center;padding:50px;font-size:44px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.sprout{animation:sw 1.6s ease-in-out infinite}@keyframes sw{50%{transform:rotate(-8deg) scale(1.08)}}}
.view{animation:in .4s ease both}@keyframes in{from{opacity:0;transform:translateY(14px)}}
.tile,.btn,.les,.pl{transition:transform .15s,box-shadow .25s}.tile:active,.btn:active,.les:active,.pl:active{transform:scale(.95)}
.tile:hover,.pl:hover{box-shadow:0 0 20px rgba(55,164,73,.5)}.glow{box-shadow:0 0 24px rgba(55,164,73,.35)}
.tile.vip,.btn.gold,.banner{box-shadow:0 0 22px rgba(246,199,68,.6);animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 36px rgba(246,199,68,1)}}
.grid .tile{animation:in .5s both}.tile:nth-child(odd){animation-delay:.05s}.tile:nth-child(even){animation-delay:.13s}
.bar div{animation:fill 1.2s ease both}@keyframes fill{from{width:0}}
.grid3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pl{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 2px;font:800 12px Nunito;color:var(--ink);text-align:center}.pl i{display:block;font-style:normal;font-size:30px}
.sec{border-left:4px solid var(--g1);animation:in .5s both;animation-delay:var(--d)}.sec p{margin:6px 0 0;line-height:1.55}.tipc{background:var(--goldbg);border-color:#e3b82f}
.big{font-size:68px;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dot{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:16px}.dot.on{background:var(--gold);box-shadow:0 0 14px var(--gold)}
.opt{position:relative;overflow:visible}.opt.right{background:linear-gradient(135deg,#37a449,#14532d);color:#fff;border-color:#8fe3a0;animation:r3d .9s ease both;box-shadow:0 0 28px #37a449}
@keyframes r3d{0%{transform:perspective(500px) rotateY(0)}50%{transform:perspective(500px) rotateY(180deg) translateZ(50px) scale(1.08)}100%{transform:perspective(500px) rotateY(360deg)}}
.opt.wrong{background:#7a1f16;color:#fff;animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sp{position:absolute;left:50%;top:50%;font-style:normal;pointer-events:none;animation:spark .9s ease-out forwards}@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.cele{position:fixed;inset:0;z-index:20;background:radial-gradient(#5a4300,#000c);display:grid;place-content:center;text-align:center;color:#fff;padding:24px;overflow:hidden;animation:in .4s both}
.cele>*{position:relative}.cele .crown{font-size:110px;animation:spin3d 3s ease-in-out infinite;filter:drop-shadow(0 0 30px gold)}@keyframes spin3d{to{transform:perspective(500px) rotateY(360deg)}}
.rays{position:absolute!important;inset:-50%;background:repeating-conic-gradient(#f6c74440 0 10deg,transparent 10deg 20deg);animation:rot 20s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.cele i{position:absolute;top:-30px;font-style:normal;animation:fall 3s linear infinite}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
:root{--bg:#d4f7cf;--card:#fff;--ink:#17311f;--mute:#4f7a5a;--line:#b5e3b5;--goldbg:#fff0b8}
html,body{background:linear-gradient(160deg,#b9f6ca 0%,#e8ffd6 45%,#fff3b0 100%) fixed;color:var(--ink)}h1{color:#14532d}nav{background:#fff}
.btn{background:linear-gradient(#52d06a,#1f8f3a);border-bottom:6px solid #0f5a24;box-shadow:0 8px 14px rgba(20,83,45,.35),inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.btn:active{transform:translateY(5px);border-bottom-width:1px;box-shadow:0 2px 4px rgba(20,83,45,.3)}
.btn.gold{background:linear-gradient(#ffe27a,#e0a914);border-bottom-color:#9a6b00;text-shadow:none}
.btn.ghost{background:#fff;border:2px solid var(--g1);border-bottom-width:5px;text-shadow:none;color:var(--g2)}.btn[disabled]{filter:grayscale(.7);opacity:.6}
.tile,.les,.pl{border-bottom:5px solid #9fd6a4;box-shadow:0 6px 10px rgba(20,83,45,.15)}.tile.vip{border-bottom-color:#c99a14}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{border:2px solid var(--g1);border-bottom-width:4px;background:#fff;color:var(--g2);border-radius:20px;padding:8px 14px;font:800 14px Nunito}.chip.on{background:var(--g1);color:#fff}
.les.pick{background:#d9f2dc;border-color:var(--g1)}.card h2{margin-top:0}
.cele{position:fixed;inset:0;z-index:20;background:rgba(10,40,20,.45);display:grid;place-items:center;padding:24px;animation:in .25s both}
.cbox{background:#fff;border-radius:24px;padding:28px 24px;text-align:center;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .3s ease both}@keyframes pop{from{transform:scale(.92);opacity:0}}
.ci{font-size:52px}.cbox h2{margin:8px 0}.cbox p{color:var(--mute);margin:0 0 8px}
.tile.vip,.btn.gold,.banner,.big{animation:none}.glow{box-shadow:0 4px 14px rgba(20,83,45,.12)}.grid .tile{animation:none}
.opt.right{animation:none;box-shadow:none}.opt.wrong{animation:none}.sp{display:none}
details summary{cursor:pointer}details p{margin:8px 0 0}
.qbox{background:linear-gradient(135deg,#14532d,#2e8b3d);color:#fff;border-radius:18px;padding:16px;font:800 18px/1.35 Nunito;margin:14px 0 8px;box-shadow:0 6px 14px rgba(20,83,45,.25)}
.qbox small{display:block;opacity:.8;font-weight:700;font-size:12px;letter-spacing:.1em;margin-bottom:6px}
.ans{background:#f6fff5;border:1.5px dashed #9fd6a4;font-weight:600}.ans .n{background:#e3f3e4;color:#14532d}
.okc{border-left:5px solid #2e8b3d}.badc{border-left:5px solid #c0392b;background:#fff5f4}.okc p,.badc p{margin:6px 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.stat2{background:#fff;border-radius:14px;padding:10px 12px;border-bottom:3px solid #cfe9d1}.stat2 small{color:var(--mute);display:block}.stat2 b{font-size:18px}
.hrs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.hr{flex:none;background:#fff;border-radius:12px;padding:8px 10px;text-align:center;font-size:13px;border-bottom:3px solid #cfe9d1}
.wday{display:block;width:100%;text-align:left;font:600 15px Nunito;color:var(--ink)}
html,body{background:linear-gradient(180deg,#eaf6e4 0%,#fbfdf7 60%) fixed}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}.hdr .logo{font-size:38px}.brand{font:800 26px Nunito;color:#14532d;line-height:1}.brand span{color:#4caf50}
.hdr>div:nth-child(2){flex:1}.ib{border:0;background:#fff;border-radius:50%;width:42px;height:42px;font-size:19px;box-shadow:0 3px 8px rgba(20,83,45,.15)}
.hero{position:relative;border-radius:24px;padding:22px 20px;color:#fff;overflow:hidden;min-height:170px;background:linear-gradient(90deg,#14532d 0%,#14532dcc 45%,#14532d33 100%),url(/img/hero.jpg) center/cover,linear-gradient(135deg,#14532d,#4caf50)}
.hero h1{color:#fff;margin:0 0 6px;font-size:28px}.hero p{margin:0 0 14px;max-width:62%;font-size:16px;line-height:1.35}.hbtn{border:0;border-radius:24px;padding:12px 22px;font:800 16px Nunito;color:#fff;background:#6fb64a;border-bottom:4px solid #4f8f32}
.hart{position:absolute;right:14px;bottom:8px;font-size:48px;opacity:.9}
.qt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.qt button{border:0;border-radius:18px;padding:12px 4px;font:800 12.5px Nunito;color:#14532d;background:#e6f3e3;border-bottom:4px solid #cfe6cc}.qt button i{display:block;font-style:normal;font-size:32px;margin-bottom:4px}.qt .r{background:#fde9e9;border-bottom-color:#f5cfcf}.qt .y{background:#fff3d1;border-bottom-color:#f0deaa}
.sh{display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px}.sh h2{margin:0;font-size:21px;color:#14532d}.lnk{border:0;background:none;font:800 14px Nunito;color:#14532d}
.tk{display:flex;align-items:center;gap:12px;background:#eaf5e6;border-radius:16px;padding:12px 14px;margin:6px 0}.tk b{display:block}.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #7a8f7d;background:#fff}
.wcard{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:20px;padding:14px;margin:12px 0;background:linear-gradient(180deg,#d6ecfb,#eaf7e1);font:600 14px Nunito;color:#17311f;text-align:left}.wcard .wi{font-size:40px}.wcard .wt{font-size:32px;font-weight:800}.wcard .adv{flex:1;border-left:1px solid #b6d3c0;padding-left:12px;font-size:13px}
</style>

<body>
<div id="app"><div class="load"><span class="sprout" style="display:inline-block">🌱</span></div></div>
<nav id="nav" hidden></nav>
<script src="/data.js"></script>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=t=>new Date(t).toLocaleDateString('ru-RU');
let me=null,stack=[],cur='home';
const ACH={first:['🌱','Первый урок'],five:['📚','5 уроков'],garden:['🪴','Свой огород'],week:['📅','7 дней с нами'],promo:['🏷️','Промокод'],vip:['👑','VIP-садовод']};
async function api(action,data={}){
  const r=await fetch('/api/rpc',{method:'POST',headers:{'content-type':'application/json','x-init':tg?.initData||''},body:JSON.stringify({action,...data})});
  const j=await r.json().catch(()=>({error:'Ошибка сети'}));if(!r.ok)throw new Error(j.error||'Ошибка');return j;
}
function toast(t,err){const e=document.createElement('div');e.className='toast'+(err?' err':'');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}
const act=async(fn)=>{try{return await fn()}catch(e){toast(e.message,1)}};
const head=(t,back=1,x='')=>`<div class="top">${back&&!root.includes(cur)?'<button class="back" aria-label="Назад" onclick="back()">‹</button>':''}<b>🌱 ${t}</b>${x}<button class="back" aria-label="Поиск" onclick="go('search','')">🔍</button>${me?.vip?'<span style="font-size:26px">👑</span>':''}</div>`;
const tabs=[['home','🏠','Главная'],['garden','🌿','Грядки'],['calendar','🗓️','Календарь'],['lessons','📖','Уроки'],['more','☰','Ещё']];
function go(v,a){stack.push([cur,curArg]);cur=v;curArg=a;draw()}
let curArg;
function back(){const p=stack.pop();if(p){cur=p[0];curArg=p[1];draw()}}
function tab(v){stack=[];cur=v;curArg=null;draw()}
const root=['home','garden','calendar','lessons','more'];
async function draw(){
  if(me&&!me.profile)cur='onboard';
  const nav=$('#nav');nav.hidden=!me||!root.includes(cur);
  nav.innerHTML=tabs.map(([v,i,t])=>`<button class="${v===cur?'on':''}" onclick="tab('${v}')"><i>${i}</i>${t}</button>`).join('');
  window.scrollTo(0,0);
  if(tg){tg.BackButton[stack.length?'show':'hide']();}
  try{app.innerHTML='<div class="view">'+await V[cur](curArg)+'</div>'}catch(e){app.innerHTML=head('Садовест',0)+`<div class="card center">${esc(e.message)}<button class="btn" onclick="init()">Повторить</button></div>`}
}
tg?.BackButton.onClick(back);
const V={
home:()=>`<h1>Привет, ${esc(me.name)}!</h1>
<div class="grid">
${[['lessons','📖','Уроки'],['garden','🪴','Мой огород'],['community','💬','Сообщество'],['shop','🧺','Магазин'],['vip','👑','VIP-клуб','vip'],['support','🛟','Поддержка'],['calendar','🗓️','Календарь']].map(([v,i,t,c])=>`<button class="tile ${c||''}" onclick="${v==='community'?'tab':'go'}('${v}')"><i>${i}</i>${t}</button>`).join('')}
</div>
${me.vip?'':`<button class="banner" onclick="go('vip')"><i>👑</i><span>VIP-доступ<small>Больше знаний. Больше возможностей.</small></span></button>`}
${me.admin?`<button class="btn ghost" onclick="go('admin')">⚙️ Панель администратора</button>`:''}`,

async lessons(){
  const {items}=await api('lessons');const row=l=>`<button class="les ${l.locked?'lock':''}" onclick="${l.locked?"go('vip')":`go('lesson',${l.id})`}"><span class="n">${l.locked?'🔒':l.done?'✅':l.id}</span><span>${esc(l.title)}</span><span class="tag ${l.free?'':'v'}">${l.free?'Бесплатно':'VIP'}</span></button>`;
  return head('Уроки',0)+`<div class="mute">Доступно уроков: ${me.vip?items.length:items.filter(l=>l.free).length} из ${items.length}</div><h2>Бесплатные уроки</h2>`+items.filter(l=>l.free).map(row).join('')+`<h2>VIP-уроки (${items.filter(l=>!l.free).length})</h2>`+items.filter(l=>!l.free).map(row).join('')},

async lesson(id){const l=await api('lesson',{id});
  return head('Урок')+`<div class="card"><h2 style="margin-top:0">${esc(l.title)}</h2><p>${esc(l.text)}</p></div><button class="btn" ${l.done?'disabled':''} onclick="finish(${l.id})">${l.done?'✅ Пройден':'Отметить пройденным'}</button>`},

vip:()=>`${head('VIP-клуб')}<div class="card" style="background:linear-gradient(135deg,#fff3c9,#ffe28a);color:#4a3600;border-color:#e3b82f"><div class="center" style="font-size:56px">👑</div><h1 class="center" style="color:#4a3600;margin:0">VIP-клуб</h1><p class="center" style="margin:2px 0 14px">Больше знаний — больше возможностей</p>
${['📚 Расширенные VIP-уроки','🛟 Профессиональная поддержка','⭐ Эксклюзивные материалы','🏅 Золотой значок'].map(t=>`<p style="margin:8px 0;font-weight:800">${t}</p>`).join('')}
${me.vip?`<p class="center" style="font-weight:800">VIP активен до ${fd(me.vip_until)}</p>`:''}
<button class="btn gold" onclick="buy()">${me.vip?'Продлить VIP':'Купить VIP'}</button></div>${promoBox()}`,

promo:()=>head('Промокод')+promoBox(),
async support(){
  if(!me.vip)return head('VIP-эксперт')+`<div class="card center"><div style="font-size:44px">🔒</div><b>Поддержка доступна только VIP-пользователям</b><div class="mute">Ответ в течение 1–2 часов</div><button class="btn gold" onclick="go('vip')">Открыть VIP</button></div>`;
  const {items}=await api('tickets');
  return head('VIP-эксперт')+(items.length?items.slice().reverse().map(t=>`<div class="msg me">${esc(t.text)}<div class="mute">${fd(t.created)}</div></div>${t.reply?`<div class="msg ex"><b>Эксперт 👑</b><br>${esc(t.reply)}</div>`:'<div class="mute center">Ждём ответа эксперта…</div>'}`).join(''):'<div class="card center">Опишите проблему с растением — эксперт ответит в течение 1–2 часов.</div>')+`<textarea id="tx" rows="3" maxlength="1000" placeholder="Напишите сообщение…"></textarea><button class="btn" onclick="sendT()">Отправить</button>`},

V.wday=async i=>{if(!WX&&!await loadWX())return head('Погода')+'<div class="card center">Нет данных</div>';const {d,h,name}=WX,[e,txt]=wc(d.weather_code[i]),S=(l,v)=>`<div class="stat2"><small>${l}</small><b>${v}</b></div>`;
  const hrs=[0,3,6,9,12,15,18,21].map(k=>`<div class="hr"><b>${String(k).padStart(2,'0')}:00</b><div>${R(h.temperature_2m[i*24+k])}°</div><div class="mute">💧${h.precipitation_probability[i*24+k]??0}%</div></div>`).join('');
  return head(dt(d.time[i],{weekday:'long',day:'numeric',month:'long'}))+`<div class="card glow center"><div class="big">${e}</div><h2 style="margin:0">${txt}</h2><div class="mute">📍 ${esc(name)}</div></div><div class="stats">${S('Температура',`${R(d.temperature_2m_min[i])}…${R(d.temperature_2m_max[i])} °C`)}${S('Ощущается как',`${R(d.apparent_temperature_min[i])}…${R(d.apparent_temperature_max[i])} °C`)}${S('Осадки',`${d.precipitation_sum[i]} мм`)}${S('Вероятность осадков',`${d.precipitation_probability_max[i]??0}%`)}${S('Ветер',`${R(d.wind_speed_10m_max[i])} м/с`)}${S('Порывы',`${R(d.wind_gusts_10m_max[i])} м/с`)}${S('Восход',d.sunrise[i].slice(11,16))}${S('Закат',d.sunset[i].slice(11,16))}${S('Солнце',`${(d.sunshine_duration[i]/3600).toFixed(1)} ч`)}${S('УФ-индекс',R(d.uv_index_max[i]))}</div><h2>По часам</h2><div class="hrs">${hrs}</div><h2>Что делать в огороде</h2>`+dayTips(d.temperature_2m_min[i],d.temperature_2m_max[i],d.precipitation_sum[i],d.precipitation_probability_max[i]??0,d.wind_speed_10m_max[i],d.uv_index_max[i]??0).map(x=>`<div class="card">${x}</div>`).join('')};

// ---- v6: главный экран по макету, «Ещё», уроки ----
const root2=['home','garden','calendar','lessons','more'];
let GEO=null;
async function geo(){const city=me.profile?.city||'Москва';if(GEO&&GEO.city===city)return GEO;const g=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=ru&name='+encodeURIComponent(city))).json();if(!g.results)return null;const r=g.results[0];return GEO={city,la:r.latitude,lo:r.longitude,name:r.name}}
async function loadCur(){const g=await geo();if(!g)return null;const w=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.la}&longitude=${g.lo}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&wind_speed_unit=ms&timezone=auto`)).json();return w.current}
V.home=async()=>{const [{items},cur]=await Promise.all([api('plants'),loadCur().catch(()=>null)]),now=Date.now(),end=new Date().setHours(23,59,59,999);
  const tasks=items.map(p=>({p,nx:p.last+p.every*864e5})).filter(x=>x.nx<=end+864e5).sort((a,b)=>a.nx-b.nx).slice(0,3);
  const adv=cur?(cur.temperature_2m<=1?'Заморозок: укройте рассаду':cur.temperature_2m>=28?'Жарко: поливайте вечером':cur.wind_speed_10m>=10?'Сильный ветер: подвяжите растения':'Отличные условия для работ в огороде'):'';
  return `<div class="hdr"><div class="logo">🌿</div><div><div class="brand">Сад<span>о</span>Вест</div><div class="mute">Ваш помощник в мире огорода</div></div><button class="ib" aria-label="Поиск" onclick="go('search','')">🔍</button><button class="ib" aria-label="Профиль" onclick="go('profile')">👤</button></div>
<div class="hero"><h1>СадоВест</h1><p>Больше, чем просто огород. Это забота о будущем урожае!</p><button class="hbtn" onclick="tab('garden')">Мои грядки →</button><div class="hart">🧺🍅</div></div>
<div class="qt"><button onclick="tab('garden')"><i>🌱</i>Мои культуры</button><button onclick="tab('calendar')"><i>🗓️</i>Календарь работ</button><button class="r" onclick="S2.pt='Болезни';go('plants')"><i>🐞</i>Болезни и вредители</button><button class="y" onclick="tab('lessons')"><i>💡</i>Уроки и советы</button></div>
<div class="sh"><h2>Сегодня в огороде</h2><button class="lnk" onclick="tab('calendar')">Все задачи →</button></div>
${tasks.length?tasks.map(({p,nx})=>`<div class="tk"><button class="chk" aria-label="Отметить" onclick="plant('plant_water',${p.id})"></button><div><b>Полить: ${esc(p.name)}</b><span class="mute">${nx<=end?'Сегодня':'Завтра'} · каждые ${p.every} дн.</span></div></div>`).join(''):'<div class="card center mute">Добавьте растения в «Мои грядки», и задачи по поливу появятся здесь</div>'}
<div class="card row"><span>🔥 <b>${me.streak}</b> дн. подряд</span><span style="text-align:right">🪙 <b>${me.coins}</b></span></div><div class="mute center">Серия продлевается новым уроком или тестом</div>
${cur?`<button class="wcard" onclick="go('weather')"><span class="wi">${wc(cur.weather_code)[0]}</span><b class="wt">${cur.temperature_2m>0?'+':''}${R(cur.temperature_2m)}°</b><div><b>${wc(cur.weather_code)[1]}</b><div class="mute">Влажность ${R(cur.relative_humidity_2m)}%</div><div class="mute">Ветер ${R(cur.wind_speed_10m)} м/с</div></div><div class="adv">🌱 ${adv}</div></button>`:''}
<div class="card tipc">🌤 <b>Совет:</b> ${esc(tipsFor())}</div>${me.vip?'':`<button class="banner" onclick="go('vip')"><i>👑</i><span>VIP-доступ<small>Расширенные уроки и поддержка экспертов</small></span></button>`}`};
V.more=()=>head('Ещё',0)+[['tests','📝','Тесты'],['plants','🌿','Энциклопедия: растения, болезни, вредители'],['weather','🌦️','Погода для огорода'],['board','🏆','Рейтинг'],['marks','🔖','Закладки'],['files','📄','Материалы (PDF)'],['vip','👑','VIP-клуб'],['support','🛟','Поддержка'],['profile','👤','Профиль'],['faq','❓','Вопросы и ответы'],...(me.admin?[['admin','⚙️','Панель администратора']]:[])].map(([v,e,t])=>`<button class="les" onclick="go('${v}')"><span class="n">${e}</span><span>${t}</span><span style="margin-left:auto">›</span></button>`).join('');
V.lessons=async()=>{const {items,soon}=await api('lessons'),L=['Начинающий','Любитель','Мастер'];
  const row=l=>`<button class="les ${l.locked?'lock':''}" onclick="${l.locked?"go('vip')":`go('lesson',${l.id})`}"><span class="n">${l.locked?'🔒':l.done?'✅':l.id}</span><span>${esc(l.title)}</span><span class="tag ${l.free?'':'v'}">${l.free?'Бесплатно':'VIP'}</span></button>`;
  return head('Уроки',0)+chips('lv',['Все',...L])+L.filter(l=>S2.lv==='Все'||S2.lv===l).map(l=>{const a=items.filter(i=>i.level===l);return a.length?`<h2>${{Начинающий:'🌱',Любитель:'🌿',Мастер:'🌳'}[l]} ${l}</h2>`+a.map(row).join(''):''}).join('')+(soon?`<div class="card center">🕓 Ещё ${soon} VIP-уроков готовятся и будут появляться здесь по мере выхода</div>`:'')};
init();
</script>
</body>
