<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Садовест</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module" src="/plant-recognition.js?v=26"></script>
<link rel="preload" as="image" href="/img/splash/art.webp?v=26" type="image/webp">
<style>
/* ================= СадоВест · «Изумрудное сияние» ================= */
:root{
  --bg:#ecfdf5;--card:rgba(255,255,255,.82);--cs:#fff;--ink:#0b2a1f;--mute:#47685a;--line:rgba(10,143,102,.2);
  --g1:#0a8f66;--g2:#066f4d;--g3:#0c9a8e;--mint:#34d399;--lime:#a3e635;--gold:#f6c744;--goldbg:#fff3c4;--red:#c0392b;
  /* переливы: яркий — для фонов и рамок, тёмный — под белый текст, «текстовый» — для заголовков */
  --irid:linear-gradient(115deg,#0a8f66,#14b8a6 20%,#5fd38a 42%,#a3e635 56%,#2dd4bf 76%,#0a8f66);
  --irid-d:linear-gradient(115deg,#066f4d,#0a8f66 18%,#0c9a8e 38%,#1a9a55 58%,#3f9b2a 74%,#0c9a8e 90%,#066f4d);
  --irid-t:linear-gradient(100deg,#065f46,#0a8f66 25%,#0c9a8e 50%,#2e8b3d 75%,#065f46);
  --sh:0 1px 2px rgba(6,80,56,.06),0 14px 30px -10px rgba(6,110,76,.2);--glow:rgba(20,184,166,.5);
  --page:linear-gradient(180deg,#b7efd3 0%,#d6f8e6 38%,#eefcf5 100%);--navbg:rgba(255,255,255,.9);--soft:rgba(52,211,153,.16);--soft2:rgba(45,212,191,.12);
}
html[data-theme=dark]{
  --bg:#04120c;--card:rgba(13,42,30,.76);--cs:#0d2a1e;--ink:#e6fff3;--mute:#9cc9b3;--line:rgba(94,234,168,.24);
  --g1:#34d399;--g2:#6ee7b7;--g3:#2dd4bf;--goldbg:#3a3418;
  --irid-t:linear-gradient(100deg,#6ee7b7,#34d399 25%,#5eead4 50%,#bef264 75%,#6ee7b7);
  --sh:0 1px 2px rgba(0,0,0,.45),0 16px 32px -12px rgba(0,0,0,.7);--glow:rgba(52,211,153,.4);
  --page:linear-gradient(180deg,#052418 0%,#04170f 45%,#030f0a 100%);--navbg:rgba(6,26,18,.9);--soft:rgba(52,211,153,.14);--soft2:rgba(45,212,191,.1);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);background:var(--page) fixed;min-height:100%}
html,body{margin:0;color:var(--ink);font:600 16px/1.42 Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:transparent;min-height:100vh}
/* живой фон: мягкие изумрудные, бирюзовые и лаймовые сияния */
body::before,body::after{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;transition:opacity .6s ease;will-change:transform}
body::before{background:radial-gradient(38% 32% at 16% 16%,rgba(16,185,129,.62),transparent 70%),radial-gradient(36% 30% at 86% 12%,rgba(20,184,166,.5),transparent 70%),radial-gradient(42% 36% at 82% 82%,rgba(163,230,53,.46),transparent 70%),radial-gradient(38% 32% at 10% 88%,rgba(52,211,153,.5),transparent 70%);animation:drift 28s ease-in-out infinite alternate}
body::after{opacity:0;background:radial-gradient(38% 32% at 16% 16%,rgba(16,185,129,.46),transparent 70%),radial-gradient(36% 30% at 84% 10%,rgba(45,212,191,.36),transparent 70%),radial-gradient(40% 34% at 80% 84%,rgba(132,204,22,.24),transparent 70%),radial-gradient(38% 32% at 12% 90%,rgba(6,148,100,.3),transparent 70%);animation:drift 32s ease-in-out infinite alternate-reverse}
html[data-theme=dark] body::before{opacity:0}html[data-theme=dark] body::after{opacity:1}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) rotate(0) scale(1)}to{transform:translate3d(3%,3%,0) rotate(9deg) scale(1.1)}}
@keyframes shine{from{background-position:0% 0}to{background-position:150% 0}}
@keyframes shineb{from{background-position:0 0,0% 0}to{background-position:0 0,150% 0}}
@keyframes sweep{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@keyframes fill{from{width:0}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pop{from{transform:scale(.92);opacity:0}}

#app{max-width:520px;margin:0 auto;padding:12px 14px calc(104px + env(safe-area-inset-bottom))}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0 12px;color:var(--g2)}
h2{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:20px 0 8px;color:var(--g2)}
.card h2{margin-top:0}
/* переливающийся зелёный текст заголовков */
.brand,.sh h2,.view>h1:not([style]){background:var(--irid-t);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shine 10s linear infinite}
.top{display:flex;align-items:center;gap:8px}.top b{font-size:19px;font-weight:800;flex:1}
.back,.ib{border:0;background:var(--card);color:var(--ink);border-radius:14px;width:40px;height:40px;font-size:19px;box-shadow:var(--sh);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ib{border-radius:50%;width:42px;height:42px}
.center{text-align:center}.mute{color:var(--mute);font-size:14px;font-weight:600}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.plant-row>*{min-width:0;overflow-wrap:anywhere;word-break:break-word}
.plant-row>b{flex:1 1 50%}
.plant-row>.mute{flex:0 1 45%;text-align:right}

/* ---- плитки меню: переливающаяся рамка ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;padding:16px 8px;text-align:center;font:800 15px Nunito,system-ui,sans-serif;color:var(--ink);min-height:98px;border:1.5px solid transparent;background:linear-gradient(var(--cs),var(--cs)) padding-box,var(--irid) border-box;background-size:auto,300% 100%;animation:shineb 12s linear infinite;box-shadow:var(--sh)}
.tile i{display:block;font-style:normal;font-size:36px;margin-bottom:4px;filter:drop-shadow(0 5px 6px rgba(6,111,77,.28))}
.tile.vip,.banner{background:linear-gradient(115deg,#fff0ac,#f6c744 30%,#ffe58a 50%,#f1bd2f 70%,#fff0ac);background-size:300% 100%;color:#3f2f00;border:1.5px solid #e6b92e;animation:shine 8s linear infinite;box-shadow:0 12px 26px -10px rgba(214,160,20,.75)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:var(--sh)}
.card.glow,.glow{box-shadow:0 14px 34px -12px var(--glow),var(--sh)}
.card.glow{border:1.5px solid transparent;background:linear-gradient(var(--cs),var(--cs)) padding-box,var(--irid) border-box;background-size:auto,300% 100%;animation:shineb 10s linear infinite}
.tipc{background:var(--goldbg)!important;border-color:rgba(214,160,20,.45)!important;animation:none!important}

/* ---- кнопки: перелив + блик ---- */
.btn{position:relative;overflow:hidden;display:block;width:100%;border:0;border-radius:18px;padding:15px;font:800 17px Nunito,system-ui,sans-serif;color:#fff;margin-top:10px;background:var(--irid-d);background-size:300% 100%;animation:shine 9s linear infinite;text-shadow:0 1px 2px rgba(0,40,25,.45);box-shadow:0 12px 24px -10px rgba(6,111,77,.75),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(0,0,0,.14);transition:transform .15s,box-shadow .25s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.42) 50%,transparent 64%);transform:translateX(-130%);animation:sweep 4.6s ease-in-out infinite;pointer-events:none}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(115deg,#f9dc72,#e8b52c 30%,#fdeea8 50%,#e8b52c 70%,#f9dc72);background-size:300% 100%;color:#3a2b00;font-size:19px;text-shadow:none;box-shadow:0 12px 24px -10px rgba(201,150,18,.8),inset 0 1px 0 rgba(255,255,255,.65)}
.btn.ghost{color:var(--g2);text-shadow:none;border:1.5px solid transparent;background:linear-gradient(var(--cs),var(--cs)) padding-box,var(--irid-d) border-box;background-size:auto,300% 100%;animation:shineb 9s linear infinite;box-shadow:var(--sh)}
.btn.ghost::after{display:none}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0;border-radius:12px}
.btn[disabled]{filter:grayscale(.7);opacity:.6;animation:none}
.banner{position:relative;display:flex;align-items:center;gap:10px;border-radius:20px;padding:14px;margin-top:12px;width:100%;font:800 15px Nunito,system-ui,sans-serif;text-align:left}
.banner.nw{background:var(--irid-d);background-size:300% 100%;color:#fff;border-color:transparent}.banner small{display:block;font-weight:600;opacity:.8}.banner i{font-style:normal;font-size:34px}
input,textarea,select{width:100%;border:1.5px solid var(--line);background:var(--cs);color:var(--ink);border-radius:14px;padding:13px;font:600 16px Nunito,system-ui,sans-serif;margin-top:8px;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--g1);box-shadow:0 0 0 4px rgba(20,184,166,.22)}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

/* ---- списки ---- */
.les{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 14px;margin:8px 0;font:700 15px Nunito,system-ui,sans-serif;color:var(--ink);box-shadow:var(--sh);transition:transform .15s,box-shadow .25s,border-color .25s}
.les .n{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,rgba(52,211,153,.34),rgba(45,212,191,.2));color:var(--g2);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.n img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.les.lock{opacity:.6}.lk{opacity:.7}
.les.pick{background:linear-gradient(135deg,rgba(52,211,153,.26),rgba(163,230,53,.16));border-color:var(--g1);box-shadow:0 8px 22px -10px var(--glow)}
.tag{font-size:11px;font-weight:800;border-radius:9px;padding:3px 8px;background:linear-gradient(135deg,rgba(52,211,153,.34),rgba(45,212,191,.22));color:var(--g2);margin-left:auto;flex:none}
.tag.v{background:linear-gradient(135deg,#ffe58a,#f6c744);color:#3a2b00}
.bar{height:10px;border-radius:8px;background:rgba(10,143,102,.16);overflow:hidden;margin-top:8px}
.bar div{height:100%;border-radius:8px;background:var(--irid);background-size:300% 100%;animation:fill 1.2s ease both,shine 6s linear infinite;box-shadow:0 0 12px rgba(52,211,153,.7)}
.ava{width:92px;height:92px;border-radius:50%;margin:8px auto;display:grid;place-items:center;font:800 40px Nunito,system-ui,sans-serif;color:#fff;background:var(--irid-d);background-size:300% 100%;animation:shine 8s linear infinite;border:3px solid var(--cs);box-shadow:0 0 0 3px rgba(52,211,153,.55),0 14px 30px -8px var(--glow);position:relative}
.ava.vip{box-shadow:0 0 0 4px var(--gold),0 0 32px rgba(246,199,68,.55)}.ava s{position:absolute;right:-4px;bottom:-2px;font-size:28px;text-decoration:none}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat div{background:var(--irid-d);background-size:300% 100%;animation:shine 10s linear infinite;color:#fff;border-radius:18px;padding:13px;font-weight:600;box-shadow:0 12px 24px -12px rgba(6,111,77,.8);text-shadow:0 1px 2px rgba(0,40,25,.35)}.stat b{display:block;font-size:26px;font-weight:800}
.msg{border-radius:16px;padding:10px 12px;margin:8px 0;max-width:88%;font-size:15px}.me{background:linear-gradient(135deg,rgba(52,211,153,.4),rgba(45,212,191,.28));color:var(--ink);margin-left:auto}.ex{background:var(--card);border:1px solid var(--line)}

/* ---- нижняя панель: парящее стекло ---- */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(500px,calc(100% - 20px));display:flex;padding:6px;border-radius:28px;background:var(--navbg);border:1px solid var(--line);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 18px 40px -12px rgba(6,90,62,.5),0 2px 6px rgba(6,90,62,.12);z-index:30}
nav[hidden]{display:none}
nav button{flex:1;border:0;background:none;color:var(--mute);font:800 11px Nunito,system-ui,sans-serif;padding:2px 0 4px;position:relative}
nav button i{display:block;font-style:normal;font-size:24px;height:auto}
nav button.on{color:var(--g2)}
nav button img.ni{width:36px;height:36px;border-radius:12px;display:block;margin:0 auto 3px;opacity:.82;filter:saturate(.85);transition:transform .2s ease,box-shadow .2s ease,opacity .2s ease,filter .2s ease}
nav button.on img.ni{opacity:1;filter:none;transform:translateY(-2px) scale(1.1);box-shadow:0 0 0 2px var(--mint),0 8px 18px -4px var(--glow)}
nav button.on::after{content:"";display:block;width:20px;height:3px;margin:3px auto 0;border-radius:3px;background:var(--irid);background-size:300% 100%;animation:shine 5s linear infinite}
html[data-theme=dark] nav button img.ni{filter:brightness(.88) saturate(.9)}html[data-theme=dark] nav button.on img.ni{filter:brightness(1)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--irid-d);background-size:300% 100%;animation:shine 8s linear infinite;color:#fff;padding:11px 18px;border-radius:16px;z-index:90;max-width:90%;font-weight:800;box-shadow:0 14px 30px -10px rgba(6,90,62,.7)}.toast.err{background:var(--red);animation:none}
.load{text-align:center;padding:50px;font-size:44px}
@media(prefers-reduced-motion:no-preference){.sprout{animation:sw 1.6s ease-in-out infinite}@keyframes sw{50%{transform:rotate(-8deg) scale(1.08)}}}
.view{animation:in .4s ease both}.view.soft,.view.soft .sec{animation:none}
.tile,.btn,.les,.pl{transition:transform .15s,box-shadow .25s}.tile:active,.les:active,.pl:active{transform:scale(.96)}
.tile:hover,.pl:hover,.les:hover{box-shadow:0 14px 30px -10px var(--glow)}

/* ---- грядки, растения ---- */
.grid3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pl{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:10px 2px;font:800 12px Nunito,system-ui,sans-serif;color:var(--ink);text-align:center;box-shadow:var(--sh)}.pl i{display:block;font-style:normal;font-size:30px}
.pl i img{width:44px;height:44px;border-radius:12px;object-fit:cover;display:block;margin:0 auto 2px}
.sec{animation:in .5s both;animation-delay:var(--d);box-shadow:var(--sh),inset 4px 0 0 var(--g1)}.sec p{margin:6px 0 0;line-height:1.55}
.big{font-size:68px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 10px 12px rgba(6,111,77,.3))}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dot{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:16px}.dot.on{background:var(--gold);box-shadow:0 0 14px var(--gold)}
.opt{position:relative;overflow:visible}.opt.right{background:var(--irid-d);color:#fff;border-color:var(--mint)}.opt.wrong{background:#7a1f16;color:#fff}.sp{display:none}
.pbig{width:150px;height:150px;border-radius:24px;object-fit:cover;box-shadow:0 14px 30px -10px var(--glow);background:#fff;border:2px solid var(--cs)}
.vid{width:100%;border-radius:18px;margin:10px 0;background:#000;max-height:260px}
details summary{cursor:pointer}details p{margin:8px 0 0}
details.lh summary{cursor:pointer;list-style:none}details.lh summary::-webkit-details-marker{display:none}.lh .mute{font-weight:700}

/* ---- тесты и уроки ---- */
.qbox{background:var(--irid-d);background-size:300% 100%;animation:shine 12s linear infinite;color:#fff;border-radius:20px;padding:16px;font:800 18px/1.35 Nunito,system-ui,sans-serif;margin:14px 0 8px;box-shadow:0 14px 28px -12px rgba(6,111,77,.8);text-shadow:0 1px 2px rgba(0,40,25,.35)}
.qbox small{display:block;opacity:.85;font-weight:700;font-size:12px;letter-spacing:.1em;margin-bottom:6px}
.ans{background:var(--cs);border:1.5px solid var(--line);font-weight:600}.ans .n{background:var(--soft);color:var(--g2)}
.okc{box-shadow:var(--sh),inset 5px 0 0 var(--g1)}.badc{box-shadow:var(--sh),inset 5px 0 0 var(--red)}.okc p,.badc p{margin:6px 0 0}
html[data-theme=dark] .badc{background:rgba(120,30,25,.28)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.stat2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--sh)}.stat2 small{color:var(--mute);display:block}.stat2 b{font-size:18px}
.hrs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.hr{flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center;font-size:13px}
.wday{display:block;width:100%;text-align:left;font:600 15px Nunito,system-ui,sans-serif;color:var(--ink)}
.wd{background:var(--goldbg);border-radius:14px;padding:10px 12px;margin:8px 0}.wd b{color:var(--g2)}html[data-theme=dark] .wd b{color:#f6c744}
.hk small{display:inline-block;background:var(--soft);color:var(--g2);border-radius:9px;padding:2px 8px;font-weight:800;font-size:11px;margin-bottom:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.mchips{padding-bottom:8px;margin-bottom:6px}.mchips .chip{flex:none}
.chip{border:1.5px solid var(--line);background:var(--cs);color:var(--g2);border-radius:999px;padding:8px 15px;font:800 14px Nunito,system-ui,sans-serif;transition:transform .15s}.chip:active{transform:scale(.95)}
.chip.on{background:var(--irid-d);background-size:300% 100%;animation:shine 8s linear infinite;color:#fff;border-color:transparent;text-shadow:0 1px 2px rgba(0,40,25,.35);box-shadow:0 8px 16px -8px rgba(6,111,77,.8)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tg{flex:none;width:54px;height:31px;border-radius:20px;border:0;background:rgba(120,150,135,.4);position:relative;transition:background .25s}
.tg i{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:left .22s;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.tg.on{background:var(--irid-d);background-size:300% 100%;animation:shine 8s linear infinite}.tg.on i{left:26px}

/* ---- главная ---- */
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}.hdr .logo{font-size:38px}.brand{font:800 26px Nunito,system-ui,sans-serif;line-height:1}.hdr>div:nth-child(2){flex:1}
.hero{position:relative;margin:-12px -14px 0;border-radius:0 0 32px 32px;padding:12px 18px 20px;min-height:236px;color:#fff;overflow:hidden;box-shadow:0 22px 40px -18px rgba(4,80,56,.7);background:linear-gradient(100deg,rgba(3,70,48,.94) 0%,rgba(6,111,77,.68) 46%,rgba(13,148,136,.1) 100%),url(/img/hero.jpg) center 35%/cover,linear-gradient(135deg,#066f4d,#14b8a6)}
.hero>*{position:relative;z-index:1}
.hero::before{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;z-index:2;background:var(--irid);background-size:300% 100%;animation:shine 6s linear infinite;box-shadow:0 0 18px rgba(163,230,53,.8)}
.hero::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.2) 44%,rgba(190,242,100,.22) 52%,rgba(94,234,212,.16) 60%,transparent 74%);background-size:260% 100%;animation:sheen 8s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%{background-position:130% 0}100%{background-position:-60% 0}}
.hero .hdr{margin-bottom:18px}.hero .hdr .logo{font-size:32px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}.hero .hdr .sub{color:#fff;font-weight:800;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.hero .ib{background:rgba(255,255,255,.9);color:#0b2a1f;border-color:transparent}
.hero h1{color:#fff;margin:0 0 6px;font-size:30px;text-shadow:0 2px 12px rgba(0,0,0,.5)}.hero p{margin:0 0 14px;max-width:68%;font-size:16px;line-height:1.35;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.hbtn{border:0;border-radius:16px;padding:12px 22px;font:800 16px Nunito,system-ui,sans-serif;color:#0b3d2a;background:linear-gradient(115deg,#d9fbe8,#bef264 50%,#d9fbe8);background-size:300% 100%;animation:shine 6s linear infinite;box-shadow:0 10px 22px -8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.7)}
.hart{position:absolute;right:14px;bottom:8px;font-size:48px;opacity:.9}
.qt{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0}.qt button{padding:0;border:0;background:none;border-radius:20px;box-shadow:0 12px 22px -10px rgba(6,100,70,.55);transition:transform .15s,box-shadow .2s}
.qt button:active{transform:scale(.95)}.qt img{width:100%;display:block;border-radius:20px}html[data-theme=dark] .qt img{filter:brightness(.92) saturate(.95)}
.sh{display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px}.sh h2{margin:0;font-size:21px}.lnk{border:0;background:none;font:800 14px Nunito,system-ui,sans-serif;color:var(--g2)}
.tk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:8px 0;box-shadow:var(--sh)}.tk b{display:block}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--g1);background:var(--cs);box-shadow:0 0 0 4px rgba(52,211,153,.16);transition:background .2s,transform .15s}.chk:active{background:var(--mint);transform:scale(.9)}
.wcard{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);border-radius:22px;padding:14px;margin:12px 0;background:linear-gradient(135deg,rgba(125,211,252,.4),rgba(52,211,153,.34) 55%,rgba(190,242,100,.3));font:600 14px Nunito,system-ui,sans-serif;color:var(--ink);text-align:left;box-shadow:var(--sh)}
html[data-theme=dark] .wcard{background:linear-gradient(135deg,rgba(40,100,140,.4),rgba(16,120,90,.4) 55%,rgba(80,130,20,.3))}
.wcard .wi{font-size:40px}.wcard .wt{font-size:32px;font-weight:800}.wcard .adv{flex:1;border-left:1px solid var(--line);padding-left:12px;font-size:13px;min-width:0;overflow-wrap:anywhere}
@media(max-width:480px){.wcard{flex-wrap:wrap;gap:8px 12px}.wcard .adv{flex:1 1 100%;border-left:0;border-top:1px solid var(--line);padding:8px 0 0}}@media(max-width:360px){.hero p{max-width:76%}}

/* ---- календарь ---- */
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0}.mg b{text-align:center;font-size:12px;color:var(--mute)}
.md{border:2px solid transparent;border-radius:13px;background:var(--card);padding:4px 0;text-align:center;font:700 12px Nunito,system-ui,sans-serif;color:var(--ink);min-height:48px}.md i{display:block;font-style:normal;font-size:20px;line-height:1.1}
.md.g{border-color:rgba(52,211,153,.8);background:linear-gradient(180deg,var(--card),var(--soft))}.md.r{border-color:#e08a80;background:rgba(224,138,128,.14)}.md.t{box-shadow:0 0 0 2px var(--g2),0 8px 16px -6px var(--glow)}.md.sel{background:var(--soft);color:var(--g2)}

/* ---- праздник и подсказки ---- */
.cele{position:fixed;inset:0;z-index:20;background:rgba(2,30,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px;animation:in .25s both}
.cbox{background:var(--cs);color:var(--ink);border-radius:26px;padding:28px 24px;text-align:center;max-width:340px;border:1.5px solid transparent;background:linear-gradient(var(--cs),var(--cs)) padding-box,var(--irid) border-box;background-size:auto,300% 100%;animation:pop .3s ease both,shineb 8s linear infinite;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.ci{font-size:52px}.cbox h2{margin:8px 0}.cbox p{color:var(--mute);margin:0 0 8px}
.rays,.crown{display:none}
#tour{position:fixed;inset:0;z-index:70}
#tour .spot{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(2,26,18,.7),0 0 0 3px #bef264,0 0 22px 4px rgba(190,242,100,.7);transition:all .3s;pointer-events:none}
#tour .dim{position:fixed;inset:0;background:rgba(2,26,18,.7)}
#tour .tb{position:fixed;left:12px;right:12px;max-width:500px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;animation:in .3s both}
#tour .mole{width:92px;height:92px;flex:none;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.45);animation:bob 1.4s ease-in-out infinite;background:#fff}
#tour .bub{flex:1;background:#fff;color:#0b2a1f;border-radius:20px;padding:12px 14px;box-shadow:0 14px 30px -8px rgba(0,0,0,.5);font-weight:700;line-height:1.35}
#tour .tr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}#tour .tr .mute{color:#47685a}
#tour .x{position:fixed;top:12px;right:12px;z-index:72;border:0;border-radius:18px;padding:8px 14px;font:800 14px Nunito,system-ui,sans-serif;color:#0b2a1f;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.35)}

/* ---- заставка: картина с живой анимацией ---- */
#splash{position:fixed;inset:0;z-index:60;overflow:hidden;background:#07351f;transition:opacity .6s ease,transform .7s cubic-bezier(.4,0,.2,1)}
#splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
.sp-bg{position:absolute;inset:-3%;background:#0b3d26 url(/img/splash/bg.webp?v=26) center/100% 100%;filter:saturate(1.35) brightness(.95)}
.sp-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,30,18,.35),rgba(2,30,18,0) 22%,rgba(2,30,18,0) 74%,rgba(2,24,14,.5))}
.sp-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;--aw:min(147vw,98vh);--u:calc(var(--aw)/100)}
.sp-art{position:relative;flex:none;width:var(--aw);height:var(--aw);opacity:0;-webkit-mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.45) 6%,#000 17%,#000 93%,rgba(0,0,0,.4) 97%,transparent 100%),linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.45) 6%,#000 17%,#000 93%,rgba(0,0,0,.4) 97%,transparent 100%),linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%);mask-composite:intersect}
.sp-art.ready{opacity:1;animation:spIn 1.1s cubic-bezier(.2,.8,.2,1) both,spKen 16s ease-in-out 1.1s infinite alternate}
.sp-art>*{position:absolute}.sp-img{inset:0;width:100%;height:100%;display:block}
@keyframes spIn{from{opacity:0;transform:scale(1.14);filter:blur(14px) saturate(1.4)}to{opacity:1;transform:none;filter:none}}
@keyframes spKen{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.055) translate3d(-.8%,-.6%,0)}}
/* солнце и лучи */
.sp-sun{left:-8%;top:-8%;width:44%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,252,215,.95) 0,rgba(255,226,130,.5) 26%,rgba(255,200,90,.12) 52%,transparent 68%);mix-blend-mode:screen;animation:spSun 3.6s ease-in-out infinite}
@keyframes spSun{50%{transform:scale(1.22);opacity:.78}}
.sp-rays{left:-6%;top:-6%;width:80%;height:80%;background:repeating-conic-gradient(from 105deg at 12% 12%,rgba(255,244,180,0) 0 5deg,rgba(255,244,180,.34) 8deg,rgba(255,244,180,0) 12deg 17deg);-webkit-mask-image:radial-gradient(circle at 12% 12%,#000 0,transparent 68%);mask-image:radial-gradient(circle at 12% 12%,#000 0,transparent 68%);mix-blend-mode:screen;transform-origin:12% 12%;animation:spRays 9s ease-in-out infinite alternate}
@keyframes spRays{from{transform:rotate(-7deg);opacity:.55}to{transform:rotate(7deg);opacity:1}}
/* вывеска: сияние логотипа и бегущий блик */
.sp-logo{left:41%;top:7.8%;width:18%;aspect-ratio:1.1;border-radius:50%;background:radial-gradient(ellipse,rgba(205,255,125,.75),rgba(120,230,60,.25) 45%,transparent 70%);mix-blend-mode:screen;animation:spGlow 2.4s ease-in-out infinite}
@keyframes spGlow{50%{transform:scale(1.2);opacity:.6}}
.sp-sign{inset:0;mix-blend-mode:soft-light;overflow:hidden}
.sp-sign::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.9) 50%,transparent 62%);background-size:260% 100%;background-position:130% 0;animation:spSign 3.8s ease-in-out infinite}
@keyframes spSign{0%,30%{background-position:130% 0}100%{background-position:-60% 0}}
/* бабочки: крылья машут, сами летают */
.sp-bf{will-change:transform;transform-origin:50% 55%}
.sp-bf img{display:block;width:100%;transform-origin:50% 60%;animation:spFlap .42s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.28))}
@keyframes spFlap{0%,100%{transform:scale(1,1)}50%{transform:scale(.5,1.06)}}
.sp-bf.b1{animation:spFly1 13s ease-in-out infinite}
.sp-bf.b2{animation:spFly2 16s ease-in-out -4s infinite}
.sp-bf.b3{animation:spFly3 12s linear 1.5s infinite;opacity:0}.sp-bf.b3 img{animation-duration:.34s}
@keyframes spFly1{0%,100%{transform:translate(0,0) rotate(-8deg)}20%{transform:translate(calc(var(--u)*-9),calc(var(--u)*-3)) rotate(-18deg)}40%{transform:translate(calc(var(--u)*-14),calc(var(--u)*6)) rotate(8deg)}60%{transform:translate(calc(var(--u)*-4),calc(var(--u)*11)) rotate(14deg)}80%{transform:translate(calc(var(--u)*6),calc(var(--u)*3)) rotate(-4deg)}}
@keyframes spFly2{0%,100%{transform:translate(0,0) rotate(6deg)}25%{transform:translate(calc(var(--u)*-13),calc(var(--u)*-7)) rotate(-12deg)}50%{transform:translate(calc(var(--u)*-26),calc(var(--u)*2)) rotate(10deg)}75%{transform:translate(calc(var(--u)*-12),calc(var(--u)*13)) rotate(-6deg)}}
@keyframes spFly3{0%{transform:translate(calc(var(--u)*-84),calc(var(--u)*20)) scale(.55) rotate(18deg);opacity:0}8%{opacity:.95}35%{transform:translate(calc(var(--u)*-52),calc(var(--u)*4)) scale(.55) rotate(-8deg)}65%{transform:translate(calc(var(--u)*-16),calc(var(--u)*-10)) scale(.55) rotate(12deg)}92%{opacity:.95}100%{transform:translate(calc(var(--u)*14),calc(var(--u)*-34)) scale(.55) rotate(-10deg);opacity:0}}
/* блики на плодах и капли из лейки */
.sp-spark{aspect-ratio:1;opacity:0;transform:scale(0);filter:drop-shadow(0 0 5px #fff);animation:spTw 3.2s ease-in-out infinite}
.sp-spark::before{content:"";position:absolute;inset:0;background:#fff;clip-path:polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%)}
.sp-spark::after{content:"";position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,0) 70%)}
@keyframes spTw{0%,100%{opacity:0;transform:scale(0) rotate(0)}12%{opacity:1;transform:scale(1) rotate(45deg)}30%{opacity:0;transform:scale(.25) rotate(90deg)}}
.sp-drop{width:.9%;height:1.9%;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(125,211,252,.9));opacity:0;animation:spDrop 2.7s cubic-bezier(.5,0,1,.6) infinite}
@keyframes spDrop{0%{transform:translate(0,0) scale(.6);opacity:0}10%{opacity:.95}85%{opacity:.85}100%{transform:translate(calc(var(--u)*1.4),calc(var(--u)*9));opacity:0}}
/* полоса загрузки: наша, живая, ровно поверх нарисованной */
.sp-pb{left:22.73%;top:83.97%;width:54.07%;height:8.13%;border-radius:999px;padding:calc(var(--u)*.55);background:linear-gradient(180deg,#d6ff6a,#6fcf1d 38%,#3f9a10 70%,#7bd22a);box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2.4) rgba(0,0,0,.55),0 0 calc(var(--u)*3) rgba(150,255,60,.45),inset 0 1px 0 rgba(255,255,255,.7)}
.sp-pt{height:100%;border-radius:999px;padding:calc(var(--u)*.7);overflow:hidden;background:linear-gradient(180deg,#0b0f08,#1b2315 55%,#070a05);box-shadow:inset 0 calc(var(--u)*.4) calc(var(--u)*1.2) rgba(0,0,0,.85)}
.sp-pf{position:relative;height:100%;width:0;min-width:calc(var(--u)*5);border-radius:999px;background:repeating-linear-gradient(-58deg,rgba(255,255,255,.2) 0 calc(var(--u)*2.2),rgba(255,255,255,0) calc(var(--u)*2.2) calc(var(--u)*4.4)),linear-gradient(180deg,#d4ff7a,#86e22a 38%,#4eb913 62%,#74d21f);background-size:calc(var(--u)*8.8) 100%,100% 100%;animation:spStripe .9s linear infinite;box-shadow:0 0 calc(var(--u)*2.5) rgba(160,255,70,.8)}
@keyframes spStripe{to{background-position:calc(var(--u)*8.8) 0,0 0}}
.sp-pf::after{content:"";position:absolute;left:4%;right:4%;top:11%;height:34%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.08))}
.sp-pf::before{content:"";position:absolute;right:calc(var(--u)*-1.4);top:50%;width:calc(var(--u)*5);height:calc(var(--u)*5);transform:translateY(-50%);background:radial-gradient(circle,#fff 0,rgba(205,255,120,.9) 30%,rgba(150,255,60,0) 70%);animation:spTip 1s ease-in-out infinite}
@keyframes spTip{50%{transform:translateY(-50%) scale(1.25);opacity:.8}}
/* пыльца и падающие листья по всему экрану */
.sp-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sp-pol i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,#fff8c8,rgba(255,230,120,0) 70%);opacity:0;animation:spPol var(--d) ease-in-out var(--w) infinite}
@keyframes spPol{0%{transform:translate(0,0);opacity:0}15%{opacity:.95}85%{opacity:.6}100%{transform:translate(var(--x),-22vh);opacity:0}}
.sp-lv span{position:absolute;top:-8%;width:22px;height:22px;opacity:0;animation:spLeaf var(--d) linear var(--w) infinite}.sp-lv svg{display:block;width:100%;height:100%}
@keyframes spLeaf{0%{transform:translate(0,-10vh) rotate(var(--r));opacity:0}8%{opacity:.9}50%{transform:translate(30px,48vh) rotate(calc(var(--r) + 160deg))}100%{transform:translate(-20px,112vh) rotate(calc(var(--r) + 330deg));opacity:.5}}
/* ---- переливающаяся рамка у карточек (маска, фон остаётся прозрачным) ---- */
.card,.les,.tk,.pl,.stat2,.hr,.wcard,.md{position:relative}
.card::before,.les::before,.tk::before,.pl::before,.stat2::before,.hr::before,.wcard::before{content:"";position:absolute;inset:-1px;padding:1.5px;border-radius:inherit;background:var(--irid);background-size:300% 100%;opacity:.55;pointer-events:none;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.card.glow::before{display:none}
.tile:hover::before,.les:active::before,.card:active::before{opacity:1}
.card,.tk,.stat2,.hr{background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(236,253,245,.8))}
html[data-theme=dark] :is(.card,.tk,.stat2,.hr){background:linear-gradient(135deg,rgba(16,52,38,.88),rgba(10,36,26,.82))}
html[data-theme=dark] :is(.card,.les,.tk,.pl,.stat2,.hr,.wcard)::before{opacity:.7}
.card.tipc,.card.okc,.card.badc{background:var(--goldbg)}
.card.okc{background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(220,252,231,.85))}html[data-theme=dark] .card.okc{background:rgba(16,70,45,.7)}
.card.badc{background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(254,226,226,.85))}



/* ---- варианты заставки: утро, день, вечер, ночь, дождь ---- */
.sp-tint,.sp-mist,.sp-lamp,.sp-stars,.sp-moon,.sp-fly,.sp-rain{display:none}
.sp-tint{inset:0;-webkit-mask-image:linear-gradient(180deg,#000 0,#000 58%,transparent 76%);mask-image:linear-gradient(180deg,#000 0,#000 58%,transparent 76%)}
.sp-img{transition:filter .6s}
.sp-fx>div{position:absolute;inset:0;pointer-events:none}
/* утро: тёплый золотой свет и лёгкий туман */
#splash.v-morning .sp-img{filter:saturate(1.1) brightness(1.04) sepia(.1)}
#splash.v-morning .sp-tint{display:block;mix-blend-mode:soft-light;background:linear-gradient(125deg,rgba(255,206,120,.7),rgba(255,235,190,.26) 48%,rgba(150,205,255,0))}
#splash.v-morning .sp-sun{left:-14%;top:-14%;width:60%}
#splash.v-morning .sp-mist{display:block;left:-10%;right:-10%;top:50%;height:32%;background:radial-gradient(60% 55% at 30% 60%,rgba(255,255,255,.55),transparent 70%),radial-gradient(55% 50% at 75% 50%,rgba(255,255,255,.4),transparent 70%);filter:blur(6px);animation:spMist 14s ease-in-out infinite alternate}
@keyframes spMist{from{transform:translateX(-4%)}to{transform:translateX(5%)}}
/* вечер: закат, тёплые тона, светлячки */
#splash.v-evening .sp-img{filter:sepia(.3) saturate(1.28) hue-rotate(-14deg) brightness(.92) contrast(1.06)}
#splash.v-evening .sp-tint{display:block;mix-blend-mode:overlay;background:linear-gradient(200deg,rgba(255,130,60,.66),rgba(255,70,110,.36) 55%,rgba(70,50,140,.42))}
#splash.v-evening .sp-sun{background:radial-gradient(circle,rgba(255,215,150,.95) 0,rgba(255,150,70,.5) 26%,rgba(255,110,50,.14) 52%,transparent 68%)}
#splash.v-evening .sp-rays{filter:hue-rotate(-28deg) saturate(1.6)}
#splash.v-evening .sp-bg{filter:sepia(.35) saturate(1.3) hue-rotate(-14deg) brightness(.8)}
#splash.v-evening .sp-lamp,#splash.v-evening .sp-fly{display:block}
#splash.v-evening .sp-fly i:nth-child(n+9){display:none}
/* ночь: луна, звёзды, светлячки, вывеска горит */
#splash.v-night{background:#03101f}
#splash.v-night .sp-img{filter:saturate(.8) hue-rotate(20deg) contrast(1.08)}
#splash.v-night .sp-tint{display:block;mix-blend-mode:multiply;background:linear-gradient(180deg,rgba(6,16,70,.88),rgba(10,32,84,.7))}
#splash.v-night .sp-sun,#splash.v-night .sp-rays,#splash.v-night .sp-bf{display:none}
#splash.v-night .sp-bg{filter:brightness(.32) saturate(.8) hue-rotate(24deg)}
#splash.v-night .sp-lamp,#splash.v-night .sp-fly,#splash.v-night .sp-stars,#splash.v-night .sp-moon{display:block}
#splash.v-night .sp-pb{box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2.4) rgba(0,0,0,.55),0 0 calc(var(--u)*6) rgba(160,255,80,.85),inset 0 1px 0 rgba(255,255,255,.7)}
/* дождь: серо-голубая гамма, струи и туман */
#splash.v-rain .sp-img{filter:saturate(.72) contrast(1.07) hue-rotate(8deg)}
#splash.v-rain .sp-tint{display:block;mix-blend-mode:multiply;background:linear-gradient(180deg,rgba(60,82,112,.72),rgba(86,108,130,.46))}
#splash.v-rain .sp-sun,#splash.v-rain .sp-rays,#splash.v-rain .sp-bf{display:none}
#splash.v-rain .sp-bg{filter:saturate(.7) brightness(.72) hue-rotate(10deg)}

/* свет фонаря на вывеске (вечер и ночь) */
.sp-lamp{left:15%;top:3%;width:70%;height:35%;background:radial-gradient(ellipse closest-side at 50% 55%,rgba(255,205,120,.6) 0,rgba(255,170,80,.22) 55%,rgba(255,170,80,0) 100%);mix-blend-mode:screen;animation:spLamp 3.2s ease-in-out infinite}
@keyframes spLamp{50%{opacity:.7}}
/* звёзды, луна, светлячки */
.sp-stars i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:0;animation:spStar var(--d) ease-in-out var(--w) infinite}
@keyframes spStar{0%,100%{opacity:.15}50%{opacity:1}}
.sp-fx>.sp-moon{inset:auto;left:auto;bottom:auto;top:calc(env(safe-area-inset-top) + 5vh);right:11vw;width:min(16vw,78px);height:auto;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fffdf0,#f5efc9 55%,#e6dcae);box-shadow:0 0 38px 12px rgba(255,248,200,.35),0 0 90px 30px rgba(190,220,255,.18);animation:spMoon 6s ease-in-out infinite}
@keyframes spMoon{50%{box-shadow:0 0 46px 16px rgba(255,248,200,.45),0 0 100px 36px rgba(190,220,255,.24)}}
.sp-fly i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,#fffbb8 0,rgba(210,255,110,.65) 40%,rgba(210,255,110,0) 72%);box-shadow:0 0 12px 3px rgba(220,255,120,.5);opacity:0;animation:spFly var(--d) ease-in-out var(--w) infinite}
@keyframes spFly{0%{transform:translate(0,0);opacity:0}12%{opacity:1}30%{opacity:.35}45%{transform:translate(calc(var(--x)*.6),calc(var(--y)*.5));opacity:1}60%{opacity:.3}78%{opacity:1}100%{transform:translate(var(--x),var(--y));opacity:0}}
/* совет внизу экрана */
.sp-tip{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 3.2vh);transform:translateX(-50%);width:min(90%,440px);padding:10px 14px;border-radius:16px;background:rgba(3,40,26,.55);border:1px solid rgba(190,255,200,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#effff5;text-align:center;font:600 13.5px/1.38 Nunito,system-ui,sans-serif;opacity:0;animation:spTipIn .6s ease 1.2s forwards;transition:opacity .35s;z-index:3}
.sp-tip b{color:#c7f58a;font-weight:800}.sp-tip.out{opacity:0!important}
@keyframes spTipIn{to{opacity:1}}

/* ---- настройки доступности ---- */
.nomo *,.nomo body::before,.nomo::before{animation:none!important;transition:none!important}body.nomo::before,body.nomo::after{animation:none!important}
body.fs-s #app{zoom:.92}body.fs-l #app{zoom:1.12}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important}}

async function api(action,data={}){
  const r=await fetch('/api/rpc',{method:'POST',headers:{'content-type':'application/json','x-init':tg?.initData||''},body:JSON.stringify({action,...data})});
  const j=await r.json().catch(()=>({error:'Ошибка сети'}));if(!r.ok)throw new Error(j.error||'Ошибка');return j;
}

const act=async(fn)=>{try{return await fn()}catch(e){toast(e.message,1)}};
const head=(t,back=1,x='')=>`<div class="top">${back&&!root.includes(cur)?'<button class="back" aria-label="Назад" onclick="back()">‹</button>':''}<b>${t}</b>${x}<button class="back" aria-label="Поиск" onclick="go('search','')">🔍</button>${me?.vip?'<span style="font-size:26px">👑</span>':''}</div>`;
const tabs=[['home','<img class="ni" src="/img/nav/home.webp" alt="">','Главная'],['garden','<img class="ni" src="/img/nav/garden.webp" alt="">','Грядки'],['calendar','<img class="ni" src="/img/nav/calendar.webp" alt="">','Календарь'],['lessons','<img class="ni" src="/img/nav/lessons.webp" alt="">','Уроки'],['more','<img class="ni" src="/img/nav/more.webp" alt="">','Ещё']];

// Мягкая перерисовка: после сохранения экран обновляется на месте — прокрутка, раскрытые блоки и введённый текст остаются
function snapUI(){
  const st={y:window.scrollY,f:{},d:[]};
  app.querySelectorAll('input[id],textarea[id],select[id]').forEach(e=>{if(e.type!=='file')st.f[e.id]=e.type==='checkbox'?e.checked:e.value});
  app.querySelectorAll('details').forEach(d=>{if(d.open){const q=d.querySelector('summary');st.d.push(q?q.textContent.trim().slice(0,80):'')}});
  const a=document.activeElement;if(a&&a.id&&app.contains(a)){st.focus=a.id;try{st.sel=[a.selectionStart,a.selectionEnd]}catch{}}
  return st}
function restoreUI(st,fields){
  if(fields)for(const id in st.f){const e=document.getElementById(id);if(!e||e.type==='file')continue;if(e.type==='checkbox')e.checked=st.f[id];else e.value=st.f[id]}
  app.querySelectorAll('details').forEach(d=>{const q=d.querySelector('summary');if(st.d.includes(q?q.textContent.trim().slice(0,80):''))d.open=true});
  if(fields&&st.focus){const e=document.getElementById(st.focus);if(e){try{e.focus({preventScroll:true});if(st.sel&&e.setSelectionRange)e.setSelectionRange(st.sel[0],st.sel[1])}catch{}}}
  window.scrollTo(0,st.y)}
// draw()        — перейти на экран: прокрутка наверх (как раньше)
// draw('soft')  — обновить на месте: сохраняются прокрутка, раскрытые блоки и введённый текст
// draw('scroll')— обновить на месте, но поля берутся заново (например, после очистки формы)
async function draw(mode){
  const my=++DRN;
  if(me&&!me.profile)cur='onboard';
  const nav=$('#nav');nav.hidden=!me||!root.includes(cur);
  nav.innerHTML=tabs.map(([v,i,t])=>`<button class="${v===cur?'on':''}" onclick="tab('${v}')"><i>${i}</i>${t}</button>`).join('');
  if(tg){tg.BackButton[stack.length?'show':'hide']();}
  const key=cur+'|'+(()=>{try{return JSON.stringify(curArg===undefined?null:curArg)}catch{return ''}})();
  const keep=!!mode&&VIEWKEY===key;
  let html;
  try{html='<div class="view'+(keep?' soft':'')+'">'+await V[cur](curArg)+'</div>'}catch(e){html=head('Садовест',0)+`<div class="card center">${esc(e.message)}<button class="btn" onclick="init()">Повторить</button></div>`}
  if(my!==DRN)return; // пока грузился этот экран, пользователь уже ушёл на другой
  const st=keep?snapUI():null;
  app.innerHTML=html;VIEWKEY=key;
  if(st)restoreUI(st,mode==='soft');else window.scrollTo(0,0);
}
// Кнопка «Сохранить»: пока идёт запрос — «Сохранение…», двойные нажатия игнорируются
const busy=async fn=>{const b=window.event&&window.event.currentTarget;const t=b?b.textContent:'';

async support(){

  const {items}=await api('tickets');

async garden(){const {items}=await api('plants');return head('Мой огород')+(items.length?items.map(p=>`<div class="card"><div class="row"><b>🌿 ${esc(p.name)}</b><span class="mute" style="text-align:right">полив каждые ${p.every} дн.</span></div><div class="mute">Последний полив: ${fd(p.last)}</div><div class="row" style="margin-top:8px"><button class="btn sm" onclick="plant('plant_water',${p.id})">💧 Полил(а)</button><button class="btn sm ghost" onclick="plant('plant_del',${p.id})">Удалить</button></div></div>`).join(''):'<div class="card center">Добавьте первое растение, и мы напомним о поливе</div>')+`<div class="card"><input id="pn" maxlength="40" placeholder="Название (например, томаты)"><input id="pe" type="number" min="1" max="60" value="3" aria-label="Полив раз в N дней"><div class="mute">Поливать раз в N дней</div><button class="btn" onclick="addPlant()">Добавить растение</button></div>`},

async calendar(){const {items}=await api('plants');const l=items.map(p=>({...p,next:p.last+p.every*864e5})).sort((a,b)=>a.next-b.next);
  return head('Календарь')+(l.length?l.map(p=>`<div class="card row"><b>💧 ${esc(p.name)}</b><span style="text-align:right;color:${p.next<Date.now()?'var(--red)':'inherit'}">${p.next<Date.now()?'Пора!':fd(p.next)}</span></div>`).join(''):'<div class="card center">Добавьте растения в «Мой огород» — здесь появится расписание полива</div>')+`<div class="card row"><span>🔔 Напоминания в Telegram</span><button class="btn sm ${me.notify?'':'ghost'}" onclick="toggleN()">${me.notify?'Включены':'Выключены'}</button></div>`},


profile(){return head('Профиль')+`<div class="center"><div class="ava ${me.vip?'vip':''}">${esc([...me.name][0]||'С').toUpperCase()}${me.vip?'<s>👑</s>':''}</div><h2 style="margin:4px 0">${esc(me.name)}</h2>${me.vip?`<div class="tag v" style="display:inline-block;font-size:14px;padding:6px 14px">VIP активен до ${fd(me.vip_until)}</div>`:'<div class="mute">Обычный аккаунт</div>'}</div>

};
const promoBox=()=>`<div class="card"><b>Промокод</b><input id="pc" maxlength="20" autocapitalize="characters" placeholder="Введите промокод"><button class="btn" onclick="usePromo()">Активировать</button></div>`;
function link(u){if(!u)return toast('Ссылка пока не настроена',1);u.startsWith('https://t.me')&&tg?tg.openTelegramLink(u):tg?tg.openLink(u):open(u)}
const buy=()=>link((me.cfg.buy||'').replace(/\{code\}/g,encodeURIComponent(me.discount?.code||'')).replace(/\{discount\}/g,me.discount?.value||0).replace(/\{id\}/g,me.id));

const usePromo=()=>act(async()=>{const was=me.vip;const r=await api('promo',{code:$('#pc').value});await refresh();if(!was&&me.vip)celebrate('👑','Добро пожаловать в VIP!',r.msg);else toast('✅ '+r.msg);tab('profile')});
const finish=id=>act(async()=>{const b=me.ach.length;await api('done',{id});await refresh();me.ach.length>b?celebrate('🏅','Новое достижение!',ACH[me.ach[me.ach.length-1]][1]):toast('Урок пройден! +2 💰');back()});
const sendT=()=>act(async()=>{await api('ticket_new',{text:$('#tx').value,photo:PH});PH='';toast('Отправлено');draw('scroll')});
const addPlant=()=>act(async()=>{const name=$('#pn').value.trim(),rawEvery=$('#pe').value.trim(),every=Number(rawEvery);if(!name)return toast('Введите название растения',1);if(name.length>40)return toast('Название растения: максимум 40 символов',1);if(!/^\d{1,2}$/.test(rawEvery)||!Number.isInteger(every)||every<1||every>60)return toast('Интервал полива: целое число от 1 до 60 дней',1);await api('plant_add',{name,every});await refresh();draw('scroll')});

const toggleN=()=>act(async()=>{await api('notify',{on:!me.notify});await refresh();draw('soft')});
const adm=(a,d)=>act(()=>busy(async()=>{await api(a,d);draw('scroll');if(/_set$|_new$|_reply$/.test(a))toast('Сохранено')}));
const newPromo=()=>adm('admin_promo_new',{code:$('#ac').value,type:$('#at').value,value:$('#av').value,limit:$('#al').value,days:$('#ad').value});
const grant=()=>act(async()=>{await api('admin_grant',{uid:$('#gu').value,days:$('#gd').value});toast('VIP выдан')});
const reply=id=>adm('admin_reply',{id,text:$('#r'+id).value});

  return head('Урок')+`<div class="card glow"><h2 style="margin:0 0 6px">${esc(l.title)}</h2><div class="mute">${esc(l.intro)}</div></div>`+l.sections.map(([h,t],i)=>`<div class="card sec" style="--d:${i*.1}s"><b>${['🌱','💧','☀️','🛡️','📌'][i%5]} ${esc(h)}</b><p>${esc(t)}</p></div>`).join('')+`<div class="card tipc">💡 <b>Совет эксперта:</b> ${esc(l.tip)}</div><button class="btn" ${l.done?'disabled':''} onclick="finish(${l.id})">${l.done?'✅ Пройден':'Отметить пройденным'}</button>`};

V.garden=async()=>{const {items}=await api('plants');

V.plantinfo=i=>{const p=PLANTS[i];return head(p.n)+`<div class="card glow center"><div class="big">${p.e}</div><h2 style="margin:0">${p.n}</h2><div class="mute">${p.k} • ${p.s} • полив каждые ${p.w} дн.</div></div><div class="card"><b>О растении</b><p>${p.i}</p><b>Когда сажать</b><p>${p.t}</p><b>Советы</b>${p.c.map(x=>`<p>✅ ${x}</p>`).join('')}</div><button class="btn" onclick="addP(${i})">Добавить в мой огород</button>`};
const addP=i=>act(async()=>{const p=await encItem('p',i);await api('plant_add',{name:p.e+' '+p.n,every:p.w});await refresh();toast('Добавлено в огород 🌿');back()});

const S2={pt:'Растения',lv:'Все'};
const bm=k=>`<button class="back" style="margin-left:auto" aria-label="Закладка" onclick="mark('${k}')">${me.bookmarks.includes(k)?'⭐':'☆'}</button>`;

V.lessons=async()=>{const {items}=await api('lessons'),L=['Начинающий','Любитель','Мастер'];
  const row=l=>`<button class="les ${l.locked?'lock':''}" onclick="${l.locked?"go('vip')":`go('lesson',${l.id})`}"><span class="n">${l.locked?'🔒':l.done?'✅':l.id}</span><span>${esc(l.title)}</span><span class="tag ${l.free?'':'v'}">${l.free?'Бесплатно':'VIP'}</span></button>`;

let LS=null;const ICO=['🌱','💧','☀️','🛡️','📌'];
V.lesson=async id=>{if(!LS||LS.l.id!==id)LS={l:await api('lesson',{id}),i:0,a:[]};
  const {l,i}=LS,sl=[...l.sections.map(([h,t],k)=>[ICO[k%5]+' '+h,t]),['🤯 Интересный факт',l.fact],['💡 Совет эксперта',l.tip]],n=sl.length,hd=head('Урок',1,bm('l:'+id));
  if(i<n)return hd+(l.done?'<div class="card tipc">✅ Урок уже пройден. Повторное прохождение не даёт монет.</div>':'')+`<div class="mute">${esc(l.title)} • слайд ${i+1} из ${n}</div><div class="bar"><div style="width:${(i+1)/n*100}%"></div></div><div class="card sec glow"><b style="font-size:19px">${sl[i][0]}</b><p style="font-size:17px">${esc(sl[i][1])}</p></div><div class="row">${i?'<button class="btn ghost" onclick="LS.i--;draw()">‹ Назад</button>':''}<button class="btn" onclick="LS.i++;draw()">${i===n-1?'К вопросам ›':'Далее ›'}</button></div>`;
  return hd+`<h2>Проверка: 3 вопроса</h2><div class="mute">Нужно верно ответить минимум на 2</div>`+l.quiz.map((q,qi)=>`<div class="card"><b>${esc(q.q)}</b>${q.o.map((x,k)=>`<button class="les ${LS.a[qi]===x?'pick':''}" onclick="pickA(${qi},${k})">${esc(x)}</button>`).join('')}</div>`).join('')+`<button class="btn" onclick="submitL()">Завершить урок</button>`};
// энциклопедия
V.plants=()=>{const P=S2.pt==='Растения',src=P?PLANTS:PESTS;let last='';
  return head('Энциклопедия')+chips('pt',['Растения','Болезни и вредители'])+src.map((x,i)=>[x,i]).sort((a,b)=>a[0].n.localeCompare(b[0].n,'ru')).map(([x,i])=>{const L=x.n[0].toUpperCase(),h=L!==last?(last=L,`<h2>${L}</h2>`):'';return h+`<button class="les" onclick="go('${P?'plantinfo':'pestinfo'}',${i})"><span class="n">${x.e}</span><span>${x.n}<div class="mute">${x.k}</div></span></button>`}).join('')};
V.plantinfo=i=>{const p=PLANTS[i];return head(p.n,1,bm('p:'+i))+`<div class="card glow center"><div class="big">${p.e}</div><h2 style="margin:0">${p.n}</h2><div class="mute">${p.k} • ${p.s} • полив каждые ${p.w} дн.</div></div><div class="card"><b>О растении</b><p>${p.i}</p><b>Когда сажать</b><p>${p.t}</p><b>Советы</b>${p.c.map(x=>`<p>✅ ${x}</p>`).join('')}</div><button class="btn" onclick="addP(${i})">Добавить в мой огород</button>`};
V.pestinfo=i=>{const p=PESTS[i];return head(p.n,1,bm('d:'+i))+`<div class="card glow center"><div class="big">${p.e}</div><h2 style="margin:0">${p.n}</h2><div class="mute">${p.k}</div></div><div class="card"><b>Признаки</b><p>${p.i}</p><b>Как бороться</b>${p.c.map(x=>`<p>✅ ${x}</p>`).join('')}</div>`};
// закладки и поиск
V.marks=async()=>{const L=(await api('lessons')).items;
  const row=k=>{const [t,i]=k.split(':'),o=t==='l'?L.find(x=>x.id==i):t==='p'?PLANTS[i]:PESTS[i];if(!o)return'';return `<button class="les" onclick="go('${t==='l'?'lesson':t==='p'?'plantinfo':'pestinfo'}',${i})"><span class="n">${t==='l'?'📖':o.e}</span><span>${esc(o.title||o.n)}</span></button>`};
  return head('Закладки')+(me.bookmarks.length?me.bookmarks.map(row).join(''):'<div class="card center">Нажмите ☆ на уроке, растении или болезни, чтобы сохранить</div>')};
let SL=[];
const results=q=>{q=(q||'').toLowerCase().trim();if(!q)return'<div class="mute center">Введите запрос</div>';const o=[];
  SL.filter(x=>x.title.toLowerCase().includes(q)).forEach(x=>o.push([`${x.locked?'🔒':'📖'} ${x.title}`,x.locked?"go('vip')":`go('lesson',${x.id})`]));

let scanPhoto='',scanResult=null,scanBusy=false,scanProgress=0;
async function choosePlantPhoto(input){
  const file=input.files?.[0];input.value='';if(!file)return;
  if(!file.type.startsWith('image/'))return toast('Выберите файл-изображение',1);
  if(file.size>15_000_000)return toast('Файл слишком большой. Выберите фото до 15 МБ.',1);
  const url=URL.createObjectURL(file);
  try{
    const image=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Не удалось открыть это изображение'));im.src=url});
    const scale=Math.min(1,1400/Math.max(image.width,image.height)),canvas=document.createElement('canvas');
    canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);
    canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82));
    if(!blob)throw new Error('Не удалось подготовить фото');
    if(blob.size>1_500_000)throw new Error('Фото слишком большое после сжатия. Выберите другое изображение.');
    scanPhoto=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Не удалось прочитать фото'));reader.readAsDataURL(blob)});
    scanResult=null;draw('soft');
  }catch(error){toast(error.message,1)}
  finally{URL.revokeObjectURL(url)}
}
async function identifyPlant(){
  if(!scanPhoto||scanBusy)return;
  scanBusy=true;scanProgress=0;scanResult=null;draw('soft');
  try{
    const guesses=await window.SadovestVision.recognizeCatalogPlant(scanPhoto,PLANTS,value=>{scanProgress=value;draw('soft')});
    const best=guesses[0],runnerUp=guesses[1];
    const confident=best&&best.score>=.16&&(!runnerUp||best.score-runnerUp.score>=.04);
    const match=confident?{...best,plant:PLANTS[best.catalogIndex]}:null;
    const available=match&&encOk('p'+match.catalogIndex)?[match]:[];
    const locked=match&&!encOk('p'+match.catalogIndex)?[match]:[];
    scanResult={
      plants:available,
      lockedPlants:locked,
      catalogMessage:available.length
        ? ''
        : locked.length
          ? 'Похоже на VIP-растение. Откройте VIP, чтобы посмотреть его описание.'
          : 'Не получилось уверенно определить растение из каталога. Попробуйте фото одного растения крупнее и при хорошем освещении.',
    };
  }
  catch(error){toast(error.message||'Не удалось распознать фото. Попробуйте ещё раз.',1)}

const ADM={
 async 'Обзор'(){const o=await api('admin_overview'),c=(n,t)=>`<div><b>${n}</b>${t}</div>`;
  return `<div class="stat">${c(o.users,'Пользователи')}${c(o.vip,'VIP сейчас')}${c(o.active,'Активны сегодня')}${c(o.active7,'Активны за 7 дней')}${c(o.new7,'Новые за 7 дней')}${c(o.lessonsDone,'Пройдено уроков')}${c(o.testsDone,'Пройдено тестов')}${c(o.tickets,'Открытые тикеты')}</div>`
  +(o.top.length?`<div class="card"><b>🔥 Популярные уроки</b>${o.top.map((x,i)=>`<div class="row" style="margin-top:6px"><span style="flex:4">${i+1}. ${esc(x.title)}</span><b style="text-align:right">${x.n}</b></div>`).join('')}</div>`:'')
  +`<div class="card mute">Промокодов: ${o.promos}.</div>`},
 async 'Промокоды'(){const {items}=await api('admin_promos');
  return `<details class="card"><summary><b>➕ Создать промокод</b></summary><input id="ac" placeholder="КОД (A–Z, 0–9)"><select id="at"><option value="vip">VIP (дни)</option><option value="coins">Монеты</option><option value="discount">Скидка %</option></select><input id="av" type="number" placeholder="Значение"><input id="al" type="number" placeholder="Лимит активаций (0 — без лимита)"><input id="ad" type="number" placeholder="Срок, дней (0 — бессрочно)"><button class="btn" onclick="newPromo()">Создать</button></details>`
  +(items.length?items.map(x=>`<div class="card row"><div style="flex:3"><b>${esc(x.code)}</b> <span class="mute">${{vip:'VIP '+x.value+' дн.',coins:x.value+' монет',discount:'скидка '+x.value+'%'}[x.type]}</span><div class="mute">Использовано ${x.used}${x.limit?' из '+x.limit:''} • ${x.expires?'до '+fd(x.expires):'бессрочно'} • ${x.active?'активен':'выключен'}</div></div><button class="btn sm ghost" style="flex:none" onclick="adm('admin_promo_toggle',{code:'${esc(x.code)}'})">${x.active?'Выкл':'Вкл'}</button><button class="btn sm ghost" style="flex:none" onclick="if(confirm('Удалить промокод?'))adm('admin_promo_del',{code:'${esc(x.code)}'})">✕</button></div>`).join(''):'<div class="card center mute">Промокодов пока нет</div>')},
 async 'Люди'(){const {items,total}=await api('admin_users',{q:AUQ}),now=Date.now();
  return `<div class="card"><div class="row"><input id="uq" value="${esc(AUQ)}" placeholder="Telegram ID или имя" onkeydown="if(event.key==='Enter')findU()"><button class="btn sm" style="flex:none" onclick="findU()">Найти</button></div><div class="mute">Всего пользователей: ${total}. ${AUQ?'Результаты поиска.':'Показаны последние новые.'}</div></div>`
  +(items.length?items.map(u=>`<div class="card"><div class="row"><b style="flex:3">${esc(u.name)} <span class="mute">#${u.id}</span></b><span class="tag ${u.vip_until>now?'v':''}" style="flex:none">${u.vip_until>now?'VIP до '+dd(u.vip_until):'без VIP'}</span></div><div class="mute">Монет ${u.coins} • уроков ${u.done} • с ${dd(u.joined)}</div><div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn sm ghost" onclick="uAct('${u.id}','vip+',30)">+30 дн.</button><button class="btn sm ghost" onclick="uAct('${u.id}','vip+',365)">+1 год</button><button class="btn sm ghost" onclick="uAct('${u.id}','vip-',0)">Снять VIP</button><button class="btn sm ghost" onclick="uAct('${u.id}','coins',100)">+100 💰</button></div></div>`).join(''):'<div class="card center mute">Никого не найдено</div>')},
 async 'Тикеты'(){const {items}=await api('admin_tickets'),op=items.filter(x=>x.status==='open'),cl=items.filter(x=>x.status!=='open'),card=x=>`<div class="card"><b>#${x.id} ${esc(x.name)}</b> <span class="mute">${dd(x.created)}${x.photo?' • 📷 фото':''}</span><p style="margin:6px 0">${esc(x.text)}</p>${x.reply?`<div class="msg ex">${esc(x.reply)}</div>`:`<input id="r${x.id}" placeholder="Ответ"><button class="btn sm" style="margin-top:8px" onclick="reply(${x.id})">Ответить</button>`}</div>`;
  return (op.length?op.map(card).join(''):'<div class="card center mute">Открытых тикетов нет</div>')+(cl.length?`<details class="card"><summary><b>Закрытые (${cl.length})</b></summary>${cl.map(card).join('')}</details>`:'')},
 async 'Рейтинг'(){const {items}=await api('lb');window.LBI=items;
  return `<details class="card"><summary><b>➕ Добавить или изменить участника</b></summary><input id="ln" maxlength="24" placeholder="Ник"><input id="ls" type="number" placeholder="Рейтинг"><button class="btn" onclick="adm('admin_lb_set',{nick:$('#ln').value,score:$('#ls').value})">Сохранить</button></details>`
  +(items.length?items.map((x,i)=>`<div class="card row"><span style="flex:3">${i+1}. ${esc(x.nick)}</span><b style="flex:none">${x.score}</b><button class="btn sm ghost" style="flex:none" onclick="adm('admin_lb_del',{nick:LBI[${i}].nick})">✕</button></div>`).join(''):'<div class="card center mute">Список пуст</div>')},
 async 'Рассылка'(){const o=await api('admin_overview'),n={'Все':o.users,'VIP':o.vip,'Без VIP':o.users-o.vip}[S2.bt];
  return `<div class="card"><b>📣 Рассылка через бота</b><textarea id="bt" rows="4" maxlength="1000" oninput="BT=this.value" placeholder="Текст сообщения">${esc(BT)}</textarea><div class="mute">Кому отправить:</div><div class="chips">${['Все','VIP','Без VIP'].map(x=>`<button class="chip ${S2.bt===x?'on':''}" onclick="S2.bt='${x}';ARM=false;draw('soft')">${x}</button>`).join('')}</div>`
  +(ARM?`<div class="card tipc">Отправить сообщение ${n} получателям?<div class="row" style="margin-top:8px"><button class="btn sm" onclick="sendBc()">Да, отправить</button><button class="btn sm ghost" onclick="ARM=false;draw('soft')">Отмена</button></div></div>`:`<button class="btn" onclick="armBc()">Отправить (${n})</button>`)
  +`<div class="mute">Сообщение получат только те, кто запускал бота и не заблокировал его.</div></div>`}
};
const findU=()=>{AUQ=$('#uq').value.trim();draw('soft')};
const uAct=(uid,a,value)=>act(async()=>{if(a==='vip-'&&!confirm('Снять VIP у пользователя?'))return;await api('admin_user_act',{uid,act:a,value});toast('Готово');draw('soft')});
const armBc=()=>{BT=(($('#bt')&&$('#bt').value)||BT).trim();if(BT.length<3)return toast('Введите текст сообщения',1);ARM=true;draw('soft')};
const sendBc=()=>act(async()=>{const text=BT.trim(),target={'Все':'all','VIP':'vip','Без VIP':'free'}[S2.bt];let off=0,sent=0,fail=0,total=0;ARM=false;toast('Отправка…');do{const r=await api('admin_broadcast',{text,target,offset:off});sent+=r.sent;fail+=r.failed;total=r.total;off=r.next}while(off!=null);BT='';toast(`Отправлено ${sent} из ${total}${fail?`, ошибок ${fail}`:''}`);draw('scroll')});
V.admin=async()=>{let body;try{body=await ADM[S2.at]()}catch(e){body=`<div class="card">${esc(e.message)}</div>`}
  return head('Админ-панель')+`<div class="hrs mchips">${Object.keys(ADM).map(x=>`<button class="chip ${S2.at===x?'on':''}" onclick="S2.at='${x}';draw()">${x}</button>`).join('')}</div>`+body};
// ---- v11: вкладка «Бот» в админ-панели (приветствие) ----
let BG=null,BB=null;
const botPrev=(t,n='Анна')=>esc(t).replace(/\{name\}/g,`<b>${esc(n)}</b>`).replace(/\n/g,'<br>');
ADM['Бот']=async()=>{const c=await api('admin_bot_get');if(BG===null)BG=c.greeting;if(BB===null)BB=c.button;
  return `<div class="card"><b>🤖 Приветствие бота (команда /start)</b><textarea id="bg" rows="6" maxlength="1000" oninput="BG=this.value;$('#bpv').innerHTML=botPrev(BG)">${esc(BG)}</textarea><div class="mute">Вместо <b>{name}</b> подставится имя пользователя. Пустые строки и эмодзи можно использовать.</div><b style="display:block;margin-top:10px">Текст кнопки под приветствием</b><input id="bb" maxlength="40" value="${esc(BB)}" oninput="BB=this.value"><button class="btn" onclick="saveBot()">Сохранить</button><div class="row" style="margin-top:8px"><button class="btn sm ghost" onclick="testBot()">Прислать мне для проверки</button><button class="btn sm ghost" onclick="resetBot()">Сбросить на стандартное</button></div></div><div class="card"><b>Так это увидит пользователь</b><div class="msg ex" id="bpv" style="max-width:100%;margin-top:8px">${botPrev(BG)}</div></div>`};
const saveBot=()=>act(()=>busy(async()=>{await api('admin_bot_set',{greeting:BG,button:BB});toast('Приветствие сохранено')}));
const testBot=()=>act(async()=>{await api('admin_bot_test',{greeting:BG,button:BB});toast('Черновик отправлен вам в чат (в рабочий текст не сохранён)')});
const resetBot=()=>act(async()=>{await api('admin_bot_reset');BG=BB=null;toast('Возвращено стандартное приветствие');draw('scroll')});
// ---- v12: раздел «Новости» (публикуются из админ-панели) ----
const nTxt=t=>esc(t).replace(/\n/g,'<br>');
V.news=async()=>{const {items}=await api('news');
  return head('Новости')+(items.length?items.map(n=>`<div class="card"><div class="row"><b style="flex:4;font-size:17px">${esc(n.emoji||'📰')} ${esc(n.title)}</b>${n.pin?'<span class="tag" style="flex:none">📌</span>':''}${n.fresh?'<span class="tag v" style="flex:none">Новое</span>':''}</div><div class="mute" style="margin:2px 0 8px">${fd(n.created)}${n.edited?' • обновлено '+fd(n.edited):''}</div><div style="font-size:16px;line-height:1.45">${nTxt(n.text)}</div></div>`).join(''):'<div class="card center mute">Новостей пока нет. Загляните позже!</div>')};
const _moreN=V.more;V.more=async()=>{let n=0;try{n=(await api('news_badge')).unread}catch{}
  const btn=`<button class="les" onclick="go('news')"><span class="n">📰</span><span>Новости${n?` <span class="tag v" style="margin-left:8px">${n}</span>`:''}</span><span style="margin-left:auto">›</span></button>`;
  return String(await _moreN()).replace('</div>','</div>'+btn)};
const _homeN=V.home;V.home=async()=>{const [h,nb]=await Promise.all([_homeN(),api('news_badge').catch(()=>null)]),l=nb&&nb.latest;
  if(!l)return h;
  const card=`<button class="banner nw" onclick="go('news')"><i>${esc(l.emoji||'📰')}</i><span>${nb.unread?'Новое: ':'Новости: '}${esc(l.title)}<small>${fd(l.created)}${nb.unread>1?' • ещё '+(nb.unread-1)+' непрочит.':''}</small></span></button>`;
  return h.includes('<div class="sh">')?h.replace('<div class="sh">',card+'<div class="sh">'):h+card};
let NW={id:0,title:'',emoji:'📰',text:'',pin:false},NWI=[];
const nwReset=()=>{NW={id:0,title:'',emoji:'📰',text:'',pin:false}};
ADM['Новости']=async()=>{const {items}=await api('admin_news');NWI=items;
  return `<div class="card"><b>${NW.id?'✏️ Редактирование новости':'➕ Добавить новость'}</b><div class="row"><input id="ne" maxlength="8" style="flex:1" value="${esc(NW.emoji)}" oninput="NW.emoji=this.value" placeholder="📰"><input id="nt" maxlength="100" style="flex:5" value="${esc(NW.title)}" oninput="NW.title=this.value" placeholder="Заголовок"></div><textarea id="nx" rows="6" maxlength="4000" oninput="NW.text=this.value" placeholder="Текст новости">${esc(NW.text)}</textarea><label class="sw" style="margin:6px 0"><span>📌 Закрепить вверху</span><input type="checkbox" style="width:22px;height:22px;margin:0;flex:none" ${NW.pin?'checked':''} onchange="NW.pin=this.checked"></label><div class="row"><button class="btn" onclick="nwSave()">${NW.id?'Сохранить':'Опубликовать'}</button>${NW.id?'<button class="btn ghost" onclick="nwReset();draw(\'soft\')">Отмена</button>':''}</div><div class="mute">Новость сразу появится в разделе «Ещё → Новости» и на главной. Бот покажет её по команде /news.</div></div>`
  +(items.length?items.map((n,i)=>`<div class="card"><div class="row"><b style="flex:4">${esc(n.emoji||'📰')} ${esc(n.title)}</b>${n.pin?'<span class="tag" style="flex:none">📌</span>':''}</div><div class="mute">${fd(n.created)}</div><div style="margin:6px 0">${nTxt(n.text.length>160?n.text.slice(0,160)+'…':n.text)}</div><div class="row" style="flex-wrap:wrap"><button class="btn sm ghost" onclick="nwEdit(${i})">Изменить</button><button class="btn sm ghost" onclick="adm('admin_news_pin',{id:NWI[${i}].id})">${n.pin?'Открепить':'Закрепить'}</button><button class="btn sm ghost" onclick="nwDel(${i})">Удалить</button></div></div>`).join(''):'<div class="card center mute">Новостей пока нет</div>')};
const nwSave=()=>act(()=>busy(async()=>{await api('admin_news_save',{id:NW.id,title:NW.title,emoji:NW.emoji,text:NW.text,pin:NW.pin});toast(NW.id?'Новость обновлена':'Новость опубликована');nwReset();draw('scroll')}));
const nwEdit=i=>{const n=NWI[i];NW={id:n.id,title:n.title,emoji:n.emoji||'📰',text:n.text,pin:!!n.pin};draw('scroll');window.scrollTo(0,0)};
const nwDel=i=>{if(confirm('Удалить новость?'))adm('admin_news_del',{id:NWI[i].id})};
const APP_VER='2.7';try{console.log('СадоВест',APP_VER)}catch{}
const _pfv=V.profile;V.profile=async(...a)=>(await _pfv(...a))+`<p class="mute center" style="margin:18px 0 4px;font-size:12px">Версия ${APP_VER}</p>`;
const _sp=document.getElementById('splash');
// Заставка: полоса плавно ползёт к ~90%, пока грузится приложение, и добегает до 100% по готовности
// Совет на заставке: берём из лайфхаков, с уклоном в сезон; пока приложение грузится дольше — меняем
(function(){
  const tip=_sp&&_sp.querySelector('#spTip');if(!tip||typeof HACKS==='undefined'||!HACKS.length)return;
  const season=[3,3,0,0,0,1,1,1,2,2,2,3][new Date().getMonth()];
  const fav=[['Посев и рассада','Теплица и парник','Подкормка и почва'],['Полив','Защита растений','Сорняки'],['Урожай и хранение','Сад и деревья','Инструменты и быт'],['Цветы и комнатные','Инструменты и быт','Посев и рассада']][season];
  let last=-1;
  const pick=()=>{const pool=Math.random()<.7?HACKS.filter(h=>fav.includes(h[0])):HACKS;let h;for(let k=0;k<5;k++){h=pool[Math.floor(Math.random()*pool.length)]||HACKS[0];if(HACKS.indexOf(h)!==last)break}
    last=HACKS.indexOf(h);return `<b>💡 Совет</b> ${esc(h[1])}. ${esc(h[2])}`};
  tip.innerHTML=pick();
  const timer=setInterval(()=>{if(!document.body.contains(_sp)){clearInterval(timer);return}tip.classList.add('out');setTimeout(()=>{tip.innerHTML=pick();tip.classList.remove('out')},380)},3800);
})();
const spRun=(()=>{
  const fill=_sp&&_sp.querySelector('#spFill'),t0=performance.now(),minT=SET.motion?2800:250;let p=0,ready=false,over=false;
  const leave=()=>{if(over)return;over=true;if(_sp){_sp.classList.add('hide');setTimeout(()=>_sp.remove(),800)}setTimeout(maybeTour,700)};
  const tick=()=>{if(over)return;const el=performance.now()-t0;
    const tgt=ready&&el>=minT?100:(el<minT?Math.min(90,el/minT*90):Math.min(97,90+(el-minT)/1200));
    p+=(tgt-p)*(tgt>=100?.2:.1);if(fill)fill.style.width=p.toFixed(2)+'%';
    if(ready&&el>=minT&&p>=99.4){if(fill)fill.style.width='100%';setTimeout(leave,320);over=over;return}
    requestAnimationFrame(tick)};
  requestAnimationFrame(tick);setTimeout(leave,15000);
  return {done:()=>{ready=true}};
})();
if(_sp){const a=document.getElementById('spArt');setTimeout(()=>a&&a.classList.add('ready'),700)}
Promise.resolve().then(()=>init()).catch(()=>{}).finally(()=>spRun.done());
</script>
</body>
</html>
